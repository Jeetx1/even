<!-- Review 12 October 2026 (engine checked against a full multi-year data file):
     · Cash flow, direct method: a realised gain or loss booked with the sale of an investment no longer takes a
       share of the cash; the whole proceeds are investing (IAS 7.14 / FER 4). Setting: einstellungen.veraeusserung.
     · Cash flow, indirect method (fallback and the new bridge): liabilities in the cash fund (credit cards) now
       reduce cash instead of adding to it; capital contributions reset at each year end.
     · Cash flow page: a collapsible reconciliation from the result to the operating cash flow, indirect method.
     · Key figures: income, gross result and EBIT are read from the file's own structure (the old code pointed
       at group codes that do not exist in this file, so every margin was empty).
     · Close year: a closing checklist (clearing accounts, in-year accruals, foreign-currency revaluation, balance
       signs, open spreads, depreciation, hand-booked accrual balances) is shown before the year is locked.
       It warns, it does not block.
     Second step, same day:
     · One structure: the statement pages, exports and reports are built from the Structure page of the file
       (ENGINE.abschlussStruktur); the hard-coded copy inside the statements engine is gone. Cash flow classes
       come from the group or account setting on the Structure page (cfKlassen), Statement settings override
       per account; the number ranges are only a fallback for accounts outside the chart.
     · Spreads roll into the new year: the Book page offers to continue earlier years' spreads for the selected
       year (ENGINE.spreadsFortfuehren), under the plan's own id, exact to the centime, never twice. New spreads
       record their per-account split on the plan (plan.konten).
     Third step, same day: the fixed-asset register (page "Fixed assets", file key `anlagen`, ENGINE.anlage*).
     · A purchase booked on an account of a group flagged "Fixed assets" on the Structure page opens the register
       dialog: life, residual value, first month, contra and depreciation account, monthly or yearly booking, with
       the schedule and a chart before confirming. Assets already on the books are registered with the depreciation
       booked so far; the register continues from the month chosen.
     · Straight-line to the residual value; bookings carry plan {rolle:"abschreibung"} so they undo, roll into the
       next year with the spreads, and keep closed years untouched (a changed estimate is spread prospectively).
     · Sell / scrap: depreciation to the month of disposal, derecognition, gain or loss to 6815 / 6810 (ordinary
       result, settings abgangGewinn / abgangVerlust); the direct cash flow shows the whole proceeds as investing.
     · The closing checklist compares every asset's booked depreciation with its schedule. -->
