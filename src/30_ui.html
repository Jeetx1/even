function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function heute(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function klon(o){ return JSON.parse(JSON.stringify(o)); }
function kontenSortiert(){ return E.konten(state).sort((a,b)=>a.nr.localeCompare(b.nr,"de",{numeric:true})); }
function kontoName(nr){ const k = ix && ix.km[nr]; return k ? k.name : "unknown account"; }

function rosettenPfad(cx, cy, rho, amp, k, ph){
  let d = ""; const N = 360;
  for(let i=0; i<=N; i++){ const t = i/N*Math.PI*2, r = rho + amp*Math.sin(k*t+ph);
    d += (i?"L":"M")+(cx+r*Math.cos(t)).toFixed(2)+" "+(cy+r*Math.sin(t)).toFixed(2); }
  return d+"Z";
}

/* ---------- Meldungen und Fragen ------------------------------------- */
function meldung(text, o){
  o = o || {};
  const box = $("#meldungen"); if(!box) return;
  const el = document.createElement("div");
  el.className = "meldung" + (o.fehler ? " fehler" : "");
  el.innerHTML = `<span style="flex:1">${esc(text)}</span>`;
  if(o.aktion){ const b = document.createElement("button"); b.type = "button"; b.textContent = o.aktion.text;
    b.onclick = ()=>{ el.remove(); o.aktion.fn(); }; el.appendChild(b); }
  box.appendChild(el);
  while(box.children.length > 4) box.firstChild.remove();
  setTimeout(()=>{ if(el.parentNode) el.remove(); }, o.dauer || (o.aktion ? 8000 : 4500));
}
let frageOffen = null;
function frage(titel, text, knoepfe){
  return new Promise(resolve=>{
    const hg = $("#dlg-frage");
    $("#fr-titel").textContent = titel;
    $("#fr-text").innerHTML = text;
    $("#fr-knoepfe").innerHTML = "";
    (knoepfe || [{text:"OK", wert:true, art:""}]).forEach(k=>{
      const b = document.createElement("button"); b.type = "button";
      b.className = "btn " + (k.art || "");
      b.textContent = k.text;
      b.onclick = ()=>{ schliesse(); resolve(k.wert); };
      $("#fr-knoepfe").appendChild(b);
    });
    function schliesse(){ hg.classList.remove("on"); frageOffen = null; }
    frageOffen = ()=>{ schliesse(); resolve(null); };
    hg.classList.add("on");
    const letzter = $("#fr-knoepfe").lastChild; if(letzter) letzter.focus();
  });
}

/* ---------- Änderungen mit Rückgängig -------------------------------- */
function schnappschuss(){ return JSON.stringify(dateiObjekt()); }
// Fingerprint of everything booked in a closed year. Any change to it is refused.
function gesperrteSpur(s){
  const zu = new Set(s.abgeschlossen||[]);
  if(!zu.size) return "";
  return JSON.stringify((s.buchungen||[]).filter(b=> zu.has(parseInt(String(b.datum).slice(0,4),10))));
}
function istGeschlossen(j){ return (state.abgeschlossen||[]).indexOf(parseInt(j,10)) >= 0; }
function aendere(beschreibung, fn, o){
  o = o || {};
  const vorher = schnappschuss();
  const spur = o.jahreFrei ? null : gesperrteSpur(state);
  try{
    fn();
    if(spur !== null && gesperrteSpur(state) !== spur)
      throw new Error("this would change bookings of a closed year. Reopen the year under Setup, Years and closings, first");
  }
  catch(err){
    setzeDaten(JSON.parse(vorher), true);
    meldung("Not done: "+(err && err.message ? err.message : err), {fehler:true});
    console.error(err);
    return false;
  }
  verlauf.zurueck.push({b:beschreibung, s:vorher});
  if(verlauf.zurueck.length > 20) verlauf.zurueck.shift();
  verlauf.vor = [];
  ix = E.ctx(state); markiere();
  if(o.geruest) bauGeruest();
  if(o.render !== false) render();
  return true;
}
function setzeDaten(d, uiBehalten){
  const ui = state ? state.ui : null;
  state = d; if(uiBehalten && ui) state.ui = ui;
  ix = E.ctx(state);
}
function rueckgaengig(){
  const e = verlauf.zurueck.pop();
  if(!e){ meldung("Nothing left to undo."); return; }
  verlauf.vor.push({b:e.b, s:schnappschuss()});
  setzeDaten(JSON.parse(e.s), true); markiere(); bauGeruest(); render();
  meldung("Undone: "+e.b, {aktion:{text:"Redo", fn:wiederholen}});
}
function wiederholen(){
  const e = verlauf.vor.pop();
  if(!e){ meldung("Nothing to redo."); return; }
  verlauf.zurueck.push({b:e.b, s:schnappschuss()});
  setzeDaten(JSON.parse(e.s), true); markiere(); bauGeruest(); render();
  meldung("Redone: "+e.b);
}

/* ---------- Datei ---------------------------------------------------- */
// Everything in the file is written back, including data this version does not use itself.
function dateiObjekt(){
  return Object.assign({typ:"buchhaltung", version:5, mandant:state.mandant, jahr:state.jahr, waehrung:state.waehrung,
    kurse:state.kurse, einstellungen:state.einstellungen, sektionen:state.sektionen, titel:state.titel,
    buckets:state.buckets, gruppen:state.gruppen, konten:state.konten, buchungen:state.buchungen,
    vergleichsjahre:state.vergleichsjahre||[], abgeschlossen:state.abgeschlossen||[], ui:state.ui}, state, {version:5, settings:Object.assign({}, state.settings||{}, {theme: Kit.theme()})});
}
function vorschlag(mitDatum){ return heute()+"_EVEN"+(mitDatum ? " COPY" : "")+".json"; }
/* a file opened under an old name (…_ACCOUNTING ….json) is not written back into: the picker offers the new name once */
const neuerName = n => /_EVEN\.json$/i.test(n || "");
function markiere(){ dirty = true; KPI_REIHE = null; const b = $("#speichern"); if(b){ b.classList.add("schmutzig", "is-dirty"); $(".btn__label", b).textContent = "Save"; b.title = "Unsaved changes (Ctrl/Cmd + S)"; } arbeitskopie(); }
function sauber(){ dirty = false; arbeitskopieWeg(); const b = $("#speichern"); if(b){ b.classList.remove("schmutzig", "is-dirty"); $(".btn__label", b).textContent = "Saved"; b.title = "Everything is saved"; }
  if(geladen) document.dispatchEvent(new CustomEvent("dl:saved")); zeigeDateiname(); }
function zeigeDateiname(){
  const el = $("#dateiname"); if(!el) return;
  el.textContent = dateiname || "not saved yet";
  el.title = dateiname || "";
}
async function uebernehmen(roh, h, name, beispiel){
  let d;
  try{ d = typeof roh === "string" ? JSON.parse(roh) : roh; }
  catch(e){ meldung("This is not an accounting file (the JSON cannot be read).", {fehler:true}); return false; }
  const p = E.pruefeDatei(d, VORLAGE);
  if(p.fehler && p.fehler.length){ meldung(p.fehler.join(" "), {fehler:true}); return false; }
  state = p.daten; ix = E.ctx(state);
  handle = h || null; dateiname = name || null; geladen = true; istBeispiel = !!beispiel; basis = d && d.saved || null;
  verlauf.zurueck = []; verlauf.vor = [];
  starteApp(); sauber();
  if(d && d.settings && d.settings.theme) Kit.set(d.settings.theme, "file");
  // spreads booked the old way (straight onto 1300/2300) in open years: once onto 1305/2305 with the carry-over on 31.12.
  { const probe = E.spreadsUmstellen(JSON.parse(JSON.stringify(state)), E.ctx(state), ()=> "x");
    if(probe.plaene){
      aendere("Spreads moved to "+(state.einstellungen.araJahr||"1305")+"/"+(state.einstellungen.praJahr||"2305"), ()=>{ E.spreadsUmstellen(state, ix, naechsteId); });
      meldung(probe.plaene+" spread"+(probe.plaene===1?"":"s")+" of "+probe.jahre.join(", ")+" moved to the in-year accounts ("+probe.buchungen+" bookings changed, "+
        probe.uebertraege+" carried into the next year on 31.12.). Save to keep it, or undo.");
    } }
  if(p.warnungen.length){
    const liste = p.warnungen.slice(0,10).map(w=>"<li>"+esc(w)+"</li>").join("");
    frage("File opened with "+p.warnungen.length+" note"+(p.warnungen.length>1?"s":""),
      "All data was loaded. While reading, the following was noticed or repaired:<ul style='margin:10px 0 0;padding-left:18px'>"+liste+"</ul>"+
      (p.warnungen.length>10 ? "<p class='mut'>… and "+(p.warnungen.length-10)+" more.</p>" : ""),
      [{text:"Got it", wert:true}]);
  }
  return true;
}
async function waehleDatei(input, accept){
  return new Promise(resolve=>{
    const el = $(input);
    el.value = "";
    el.onchange = ()=> resolve(el.files && el.files[0] ? el.files[0] : null);
    el.click();
  });
}
async function oeffnen(){
  if(!(await verwerfenOk())) return;
  if(FSA){
    try{
      const [h] = await window.showOpenFilePicker({types:[{description:"Buchhaltung", accept:{"application/json":[".json"]}}], multiple:false});
      const file = await h.getFile();
      await uebernehmen(await file.text(), h, h.name);
    }catch(err){ if(err && err.name !== "AbortError") meldung("Could not open: "+err.message, {fehler:true}); }
  }else{
    const file = await waehleDatei("#dateiwahl");
    if(file) await uebernehmen(await file.text(), null, file.name);

async function schreibrechte(h){
  if(!h || !h.queryPermission) return true;
  if(await h.queryPermission({mode:"readwrite"}) === "granted") return true;
  return (await h.requestPermission({mode:"readwrite"})) === "granted";
}
function ablegen(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
async function speichern(alsNeu, mitDatum){
  if(!geladen) return false;
  if(istBeispiel && !mitDatum) alsNeu = true;
  // the file carries the moment it was saved: the next save compares it with the file on disk (fremdGespeichert)
  const vorher = state.saved, zurueckSetzen = ()=>{ state.saved = vorher; };
  state.saved = new Date().toISOString();
  const obj = dateiObjekt();
  const text = JSON.stringify(obj, null, 1);
  // Integrität: was geschrieben wird, muss sich wieder genau so lesen lassen
  try{
    const zurueck = E.pruefeDatei(JSON.parse(text), VORLAGE);
    const k1 = E.kontrolle(state, ix), k2 = E.kontrolle(zurueck.daten, E.ctx(zurueck.daten));
    if(zurueck.fehler.length || zurueck.daten.buchungen.length !== state.buchungen.length ||
       zurueck.daten.konten.length !== state.konten.length || Math.abs(k1.soll-k2.soll) > .005 || Math.abs(k1.haben-k2.haben) > .005)
      throw new Error("The check before saving failed.");
    // every year must close exactly as before, after writing and reading back
    E.ctx(zurueck.daten);
    Object.keys(E.jahreMitBuchungen(state)).forEach(j=>{
      const a = E.saldoPer(state, j+"-12-31"), b = E.saldoPer(zurueck.daten, j+"-12-31");
      Object.keys(Object.assign({}, a, b)).forEach(nr=>{ if(Math.abs((a[nr]||0)-(b[nr]||0)) > .005) throw new Error("The closing "+j+" would change on account "+nr+"."); });
    });
  }catch(err){ zurueckSetzen(); meldung("Not saved: "+err.message+" The data in this window is unchanged.", {fehler:true}); return false; }
  /* Save to folder (computer, once the app folder is chosen): today's file into the app folder, the data files it
     replaces into the backup folder (Kit.folder.save, Design Lab §6.4) */
  if(!alsNeu && !mitDatum && FSA && Kit.folder.can && await Kit.folder.get()){
    let r;
    try{ r = await Kit.folder.save({name:vorschlag(false), text:text, copyName:vorschlag(true), basis:basis,
      isData:istDatendatei, stamp:stampOf, check:liestZurueck, ask:ordnerFrage}); }
    catch(err){ zurueckSetzen(); meldung("Not saved to the folder: "+(err && err.message || err), {fehler:true}); return false; }
    if(r.cancel){ zurueckSetzen(); return false; }
    if(r.missing || r.denied){
      zurueckSetzen();
      meldung(r.missing ? "“"+r.folder+"” cannot be found any more. Moved or renamed? Choose it again." : "No access to “"+r.folder+"”. Choose it again.", {fehler:true});
      ordnerDialog(); return false;
    }
    handle = r.handle; dateiname = r.name; istBeispiel = false; basis = state.saved; sauber();
    meldung("Saved to "+r.folder+": "+r.name+(r.moved.length ? ". Moved to "+r.backup+": "+r.moved.map(m=>m[0]).join(", ") : "")+
      (r.noBackup ? ". Choose a backup folder to move the older files." : ""));
    return true;
  }
  if(FSA){
    try{
      let h = handle, alsKopie = !!mitDatum;
      /* writing back into the opened file: was it saved elsewhere since this window opened it? */
      if(!alsNeu && !mitDatum && h && neuerName(dateiname)){
        const fr = await fremdGespeichert(h);
        if(fr){ const w = await konfliktFrage(h.name, fr.saved); if(!w){ zurueckSetzen(); return false; } if(w === "neu"){ h = null; alsKopie = true; } }
      }
      if(alsNeu || mitDatum || !h || !neuerName(dateiname))
        h = await window.showSaveFilePicker({suggestedName:vorschlag(alsKopie), types:[{description:"Buchhaltung", accept:{"application/json":[".json"]}}]});
      if(!(await schreibrechte(h))){ zurueckSetzen(); meldung("Saving needs write access to the file.", {fehler:true}); return false; }
      const strom = await h.createWritable();
      await strom.write(text); await strom.close();
      if(mitDatum){ zurueckSetzen(); meldung("Dated copy saved: "+h.name); }
      else { handle = h; dateiname = h.name; istBeispiel = false; basis = state.saved; sauber(); meldung("Saved to "+h.name); }
      return true;
    }catch(err){ zurueckSetzen(); if(err && err.name !== "AbortError") meldung("Could not save: "+err.message, {fehler:true}); return false; }
  }
  const name = vorschlag(mitDatum);
  ablegen(new Blob([text],{type:"application/json;charset=utf-8"}), name);
  if(!mitDatum){ dateiname = name; istBeispiel = false; basis = state.saved; sauber(); } else zurueckSetzen();
  meldung(mitDatum ? "Dated copy downloaded: "+name : "Downloaded as "+name);
  return true;
}

/* ---------- Saved elsewhere since it was opened ----------------------- */
// The file's own "saved" stamp against the one this window started from, so a file sync that only touches the
// file date does not count. null: nothing to worry about (also when the file is gone or cannot be read).
async function fremdGespeichert(h){
  if(basis === undefined) return null;
  let text; try{ text = await (await h.getFile()).text(); }catch(e){ return null; }
  try{ const s = JSON.parse(text).saved || null; return s !== (basis || null) ? {saved:s} : null; }catch(e){ return {saved:null}; }
}
const wannText = s => s ? new Date(s).toLocaleString("en-GB", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) : "";
/* three choices: "ersetzen" (replace it), "neu" (save as a new file) or null (cancel) */
function dreiWege(titel, text, hinweis){
  return frage(titel, "<p style='margin:0'>"+esc(text)+"</p>"+(hinweis ? "<p class='klein mut' style='margin:8px 0 0'>"+esc(hinweis)+"</p>" : ""),
    [{text:"Cancel", wert:null, art:"leicht"}, {text:"Replace it", wert:"ersetzen", art:"gefahr"}, {text:"Save as a new file", wert:"neu"}]);
}
function konfliktFrage(name, saved){
  return dreiWege("Saved elsewhere since you opened it", name+" was saved again"+(saved ? " on "+wannText(saved) : "")+" after you opened it here, in another window or on another device. Saving now would replace that version.",
    "Your changes here are not lost either way.");
}
/* Save to folder asks when the app folder holds a newer data file, or today's file that is not this window's version */
function ordnerFrage(fo){
  const liste = fo.files.map(x=> x.name+(x.stamp ? " (saved "+wannText(x.stamp)+")" : "")).join(", ");
  return fo.kind === "newer"
    ? dreiWege("Saved elsewhere since you opened it", liste+" in “"+fo.folder+"” was saved after the version you have here, in another window or on another device.",
        "Replace it: that file goes to the backup folder and this version takes its place. Save as a new file: this version goes next to it as a copy.")
    : dreiWege("Today’s file is already there", liste+" is already in “"+fo.folder+"” and is not the version you have here.",
        "Replace it: the old one goes to the backup folder. Save as a new file: this version goes next to it as a copy.");
}
/* the data files a save to the app folder replaces (moved to the backup folder): today's name, the " 1" / " (1)" a
   second save adds, the old ACCOUNTING names, the daily backups of earlier builds. Copies stay where they are */
function istDatendatei(n){ return /\.json$/i.test(n) && !/COPY/i.test(n) && (/_EVEN( BACKUP)?( \d+| \(\d+\))?\.json$/i.test(n) || /ACCOUNTING/i.test(n)); }
function stampOf(t){ try{ return JSON.parse(t).saved || null; }catch(e){ return null; } }
function liestZurueck(t){
  try{ const z = E.pruefeDatei(JSON.parse(t), VORLAGE); return !z.fehler.length && z.daten.buchungen.length === state.buchungen.length && z.daten.konten.length === state.konten.length; }
  catch(e){ return false; }
}

/* ---------- Save to folder (computer): the app folder and its backup folder ---------- */
async function ordnerDialog(){
  if(!(FSA && Kit.folder.can)){ meldung("Saving to folders needs Chrome or Edge on a computer.", {fehler:true}); return; }
  const app = await Kit.folder.get(), bk = await Kit.folder.backup();
  const zeile = (id, titel, o, leer, an) => `<div class="ordnerzeile"><div><small>${titel}</small><b>${o ? "“"+esc(o.name)+"”" : leer}</b></div>`+
    `<button type="button" class="btn leicht mini" id="${id}"${an ? "" : " disabled"}>${o ? "Change …" : "Choose …"}</button></div>`;
  const antwort = frage("Save to folder",
    "<p style='margin:0 0 10px'>Save writes today’s file into the app folder and moves the file it replaces into the backup folder. Nothing is deleted.</p>"+
    zeile("od-app", "App folder", app, "Not chosen yet (e.g. APPS › EVEN)", true)+
    zeile("od-bk", "Backup folder", bk, app ? "Not chosen yet (e.g. 02 BACKUP)" : "Choose the app folder first", !!app)+
    "<p class='klein mut' style='margin:12px 0 0'>A browser only shows a folder’s name, not where it is. If you move or rename a folder, EVEN says so and you choose it again. The github.io app and a copy opened from this computer each remember their own folders.</p>",
    [app ? {text:"Stop using folders", wert:"weg", art:"leicht"} : null, {text:"Close", wert:null, art:"leicht"}, app ? {text:"Save now", wert:"jetzt"} : null].filter(Boolean));
  const waehle = async (fn, was, alt)=>{
    let neu;
    try{ neu = await fn(); }
    catch(e){ if(!e || e.name !== "AbortError") meldung(e && e.message || "This browser did not give access to that folder.", {fehler:true}); return; }
    const bk2 = await Kit.folder.backup();
    meldung(was+" folder: “"+neu.name+"”"+(alt && alt !== neu.name ? " (was “"+alt+"”)" : "")+"."+
      (was === "App" ? (bk2 ? " Backups go to “"+bk2.name+"”." : " It has no 02 BACKUP: choose a backup folder too.") : ""));
    if(frageOffen) frageOffen();
    setTimeout(ordnerDialog, 60);
  };
  $("#od-app").onclick = ()=> waehle(Kit.folder.choose, "App", app && app.name);
  $("#od-bk").onclick = ()=> waehle(Kit.folder.chooseBackup, "Backup", bk && bk.name);
  const w = await antwort;
  if(w === "weg"){ await Kit.folder.forget(); meldung("Folders forgotten. Save writes back into the opened file again."); if(state && state.ui.tab === "vergleich") render(); }
  if(w === "jetzt") speichern(false, false);
}

/* ---------- Working copy (IndexedDB): unsaved changes survive a crash or a closed tab ---------- */
let akTimer = null, akFehler = false;
function arbeitskopie(sofort){
  clearTimeout(akTimer);
  const tu = ()=>{
    if(!geladen || !dirty || istBeispiel || !state) return;
    idbSchreiben("arbeitskopie", {at:new Date().toISOString(), name:dateiname || "", basis:basis === undefined ? null : basis, daten:dateiObjekt()}).then(ok=>{
      if(!ok && !akFehler){ akFehler = true; meldung("This browser refused to keep a copy of your unsaved changes. Save regularly.", {fehler:true}); } });
  };
  if(sofort) tu(); else akTimer = setTimeout(tu, 1200);
}
function arbeitskopieWeg(){ clearTimeout(akTimer); idbLoeschen("arbeitskopie"); }
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) arbeitskopie(true); });
window.addEventListener("pagehide", ()=> arbeitskopie(true));
/* the start screen offers the unsaved changes this browser kept */
async function zeigeArbeitskopie(){
  const ak = await idbLesen("arbeitskopie"), w = $("#start .wahl"), alt = $("#s-weiter");
  if(alt) alt.remove();
  if(!w || !ak || !ak.daten) return;
  const b = document.createElement("button"); b.type = "button"; b.id = "s-weiter";
  b.innerHTML = `<span class="ic">${icon("zurueck", 18)}</span><span><b>Restore unsaved changes</b><span>From ${fd(String(ak.at).slice(0,10))} ${new Date(ak.at).toTimeString().slice(0,5)}${ak.name ? ", based on "+esc(ak.name) : ""}. They never reached a file.</span></span>`;
  b.onclick = async ()=>{
    if(!(await uebernehmen(ak.daten, null, ak.name || null))) return;
    basis = ak.basis; markiere();
    meldung("Unsaved changes restored. Save to put them into your file.");
  };
  w.insertBefore(b, w.firstChild);
}
/* opening or starting another file replaces those unsaved changes: ask first */
async function ohneArbeitskopie(fn){
  const ak = !geladen ? await idbLesen("arbeitskopie") : null;
  if(ak && ak.daten){
    const ja = await frage("Drop the unsaved changes?", "This browser holds changes that never reached a file. Opening or starting another file replaces them."+
      "<p class='klein mut' style='margin:8px 0 0'>To keep them: Cancel, then Restore unsaved changes and Save.</p>",
      [{text:"Cancel", wert:false, art:"leicht"}, {text:"Drop them", wert:true, art:"gefahr"}]);
    if(!ja) return;
  }
  fn();
}

function idb(){ return new Promise((ok, nein)=>{ const r = indexedDB.open("buchhaltung", 1);
  r.onupgradeneeded = ()=> r.result.createObjectStore("kv"); r.onsuccess = ()=> ok(r.result); r.onerror = ()=> nein(r.error); }); }
async function idbLesen(k){ try{ const db = await idb(); return await new Promise((ok, nein)=>{ const t = db.transaction("kv").objectStore("kv").get(k);
  t.onsuccess = ()=> ok(t.result); t.onerror = ()=> nein(t.error); }); }catch(e){ return null; } }
async function idbSchreiben(k, v){ try{ const db = await idb(); await new Promise((ok, nein)=>{ const t = db.transaction("kv","readwrite").objectStore("kv").put(v, k);
  t.onsuccess = ()=> ok(); t.onerror = ()=> nein(t.error); }); return true; }catch(e){ return false; } }
async function idbLoeschen(k){ try{ const db = await idb(); db.transaction("kv","readwrite").objectStore("kv").delete(k); }catch(e){} }
function leererStand(mandant, jahr, buchungen){
  return E.pruefeDatei({mandant:mandant, jahr:jahr, waehrung:"CHF", kurse:klon(VORLAGE.kurse),
    konten:klon(VORLAGE.konten), gruppen:klon(VORLAGE.gruppen), buckets:klon(VORLAGE.buckets),
    sektionen:klon(VORLAGE.sektionen), titel:klon(VORLAGE.titel), einstellungen:klon(VORLAGE.einstellungen||{}), buchungen:buchungen||[],
    ui:{tab:"uebersicht", periode:"J", ytd:false, vergleich:"start"}}, VORLAGE).daten;
}
async function neu(){
  if(!(await verwerfenOk())) return;
  const vorschlagJahr = new Date().getFullYear() + (new Date().getMonth() >= 9 ? 1 : 0);
  const w = await frage("Start a new accounting file", "First financial year <input class='eingabe num' id='neu-jahr' style='width:110px;display:inline-block;margin-left:8px' value='"+vorschlagJahr+"'>"+
    "<p class='klein mut' style='margin:12px 0 0'>The new file gets your chart of accounts and structure, with no bookings yet. Later years go into the same file: pick them in the year selector.</p>",
    [{text:"Cancel", wert:null, art:"leicht"}, {text:"Create", wert:"ok"}]);
  if(!w) return;
  const j = parseInt((document.getElementById("neu-jahr")||{}).value, 10);
  const jahr = (j >= 1900 && j <= 2200) ? j : vorschlagJahr;
  state = leererStand(VORLAGE.mandant || "Untitled", jahr, []);
  state.ui.tab = "buchen"; ix = E.ctx(state);
  handle = null; dateiname = null; basis = null; geladen = true; istBeispiel = false; verlauf.zurueck = []; verlauf.vor = [];
  starteApp(); markiere();
  const imp = await frage("Opening balances "+jahr, "Import the closing "+(jahr-1)+" now? It becomes the opening balance automatically: balance sheet accounts carry over, equity and the result of "+(jahr-1)+" roll into account "+(state.einstellungen.gewinnvortrag||"2800")+". Nothing is booked.",
    [{text:"Later", wert:false, art:"leicht"}, {text:"Import now", wert:true}]);
  if(imp) oeffneImport();
}

async function verwerfenOk(){
  if(!dirty || istBeispiel) return true;
  const w = await frage("Unsaved changes", "This file has changes that are not saved yet.",
    [{text:"Cancel", wert:"nein", art:"leicht"}, {text:"Discard", wert:"weg", art:"gefahr"}, {text:"Save", wert:"speichern"}]);
  if(w === "speichern") return await speichern(false, false);
  if(w === "weg") arbeitskopieWeg();

async function vergleichsdateiLaden(){
  let text = null, name = null;
  if(FSA){
    try{
      const [h] = await window.showOpenFilePicker({types:[{description:"Buchhaltung", accept:{"application/json":[".json"]}}], multiple:false});
      const file = await h.getFile(); text = await file.text(); name = h.name;
    }catch(err){ if(err && err.name !== "AbortError") meldung(err.message, {fehler:true}); }
  }else{
    const file = await waehleDatei("#dateiwahl"); if(file){ text = await file.text(); name = file.name; }
  }
  if(!text) return false;
  let d; try{ d = JSON.parse(text); }catch(e){ meldung("The comparison file cannot be read.", {fehler:true}); return false; }
  const p = E.pruefeDatei(d, VORLAGE);
  if(p.fehler.length){ meldung(p.fehler.join(" "), {fehler:true}); return false; }
  vgl = {state:p.daten, name:name};
  meldung("Comparison file loaded: "+name+" ("+p.daten.jahr+")");
  return true;
}

/* ---------- Perioden und Vergleich ----------------------------------- */
function periodeAktiv(){
  const ps = E.perioden(state.jahr);
  const p = ps.find(x=>x.k===state.ui.periode) || ps[0];
  return {k:p.k, titel:p.t, von: state.ui.ytd ? state.jahr+"-01-01" : p.von, bis:p.bis, ytd:state.ui.ytd};
}
function periodeText(){ const p = periodeAktiv(); return fd(p.von)+" to "+fd(p.bis); }
function kontext(){ return {state:state, ix:ix, datei:vgl}; }
function vergleichsQuelle(){
  const art = state.ui.vergleich || "";
  if(!art) return null;
  const p = periodeAktiv();
  if(art === "start") return {art:"start", label: p.von === state.jahr+"-01-01" ? "Opening" : "at "+fd(p.von)};
  if(art === "vor"){
    const s = (p.k === "J" || p.ytd) ? -12 : (p.k.charAt(0) === "Q" ? -3 : -1);
    const von = E.monatPlus(p.von.slice(0,7), s)+"-01", bis = E.monatsende(E.monatPlus(p.bis.slice(0,7), s));
    return {art:"periode", state:state, ix:ix, von:von, bis:bis, gf:true, label:fd(von)+" – "+fd(bis)};
  }
  if(art.indexOf("y:") === 0){
    const j = art.slice(2);
    return {art:"periode", state:state, ix:ix, von:j+p.von.slice(4), bis:E.monatsende(j+p.bis.slice(4,7)), gf:true, label:"same period "+j};
  }
  if(art.indexOf("imp:") === 0) return E.importQuelle(kontext(), parseInt(art.slice(4),10));
  if(art === "datei" && vgl){
    const j = vgl.state.jahr;
    const q = E.dateiQuelle(kontext(), state.ui.ytd ? j+"-01-01" : j+p.von.slice(4), E.monatsende(j+p.bis.slice(4,7)));
    q.label = vgl.name+" ("+j+")"; return q;
  }
  return null;
}
function vergleichsWerte(typ){
  const q = vergleichsQuelle();
  if(!q) return null;
  if(q.art === "start") return typ === "bilanz" ? {art:"start", label:q.label} : null;
  const m = E.flachVon(q, typ);
  if(!m) return {art:"leer", label:q.label, hinweis:q.hinweis || "There are no comparison figures for this statement."};
  return {art:"periode", label:q.label, m:m, zeigen:E.zeigenAus(m), hinweis:q.hinweis||""};
}
function bauVergleichsliste(){
  const sel = $("#vergleich"); if(!sel) return;
  const opt = [["","No comparison"],["start","Start of period"],["vor","Previous period"]];
  E.jahreImBestand(state).filter(j=>j !== String(state.jahr)).forEach(j=> opt.push(["y:"+j, "Same period "+j]));
  (state.vergleichsjahre||[]).slice().sort((a,b)=>b.jahr-a.jahr).forEach(v=> opt.push(["imp:"+v.jahr, "Closing "+v.jahr+" (imported)"]));
  opt.push(["datei", vgl ? "File: "+vgl.name : "Open comparison file …"]);
  sel.innerHTML = opt.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("");
  sel.value = opt.some(o=>o[0] === (state.ui.vergleich||"")) ? (state.ui.vergleich||"") : "";
}

// the large figure on the overview counts up when the page opens
function hochzaehlen(el){
  if(!BEWEGUNG || !el) return;
  const ziel = el.textContent, n = parseFloat(ziel.replace(/[\u2212]/g,"-").replace(/[^0-9.\-]/g,""));
  if(!isFinite(n) || Math.abs(n) < 1) return;
  const t0 = performance.now(), dauer = 650;
  const schritt = t => { const x = Math.min(1, (t - t0)/dauer), e = 1 - Math.pow(1 - x, 3);
    el.textContent = x < 1 ? fz(n*e) : ziel; if(x < 1) requestAnimationFrame(schritt); };
  requestAnimationFrame(schritt);
}
function zeigeTab(id){
  if(!SEITEN.some(s=>s.id===id)) id = "uebersicht";
  state.ui.tab = id;
  $$(".page").forEach(p=> p.classList.toggle("on", p.id === "p-"+id));
  $$("#nav button").forEach(b=> b.classList.toggle("on", b.dataset.tab === id));
  $("#titel").textContent = (SEITEN.find(s=>s.id===id)||{}).t || "";

}

    console.error(name, err);

    if(seite) seite.insertAdjacentHTML("afterbegin", `<div class="fehlerblatt" style="margin-bottom:14px"><b>This view could not be shown completely.</b>

  }
}

/* ---------- Tooltip -------------------------------------------------- */
const tipEl = $("#tip");
let tipTimer = null;
function tipAn(el, x, y){
  tipEl.innerHTML = el.getAttribute("data-tip");
  tipEl.classList.add("an");
  const r = tipEl.getBoundingClientRect();
  let l = x + 14, t = y - r.height - 12;
  if(l + r.width > window.innerWidth - 8) l = x - r.width - 14;
  if(t < 8) t = y + 18;
  tipEl.style.left = Math.max(8, l) + "px"; tipEl.style.top = t + "px";
}
document.addEventListener("pointermove", e=>{
  if(e.pointerType && e.pointerType !== "mouse") return;
  const el = e.target && e.target.closest ? e.target.closest("[data-tip]") : null;
  if(el) tipAn(el, e.clientX, e.clientY); else tipEl.classList.remove("an");
}, {passive:true});
document.addEventListener("pointerdown", e=>{
  if(!e.pointerType || e.pointerType === "mouse") return;
  const el = e.target && e.target.closest ? e.target.closest("[data-tip]") : null;
  if(!el){ tipEl.classList.remove("an"); return; }
  tipAn(el, e.clientX, e.clientY);
  clearTimeout(tipTimer); tipTimer = setTimeout(()=> tipEl.classList.remove("an"), 2600);
}, {passive:true});
window.addEventListener("scroll", ()=> tipEl.classList.remove("an"), {passive:true});

/* ---------- Charts --------------------------------------------------- */
let DIA_H = 120;
function diaZwei(reihe, fa, fb, tipFn){
  const alle = reihe.reduce((a,r)=>a.concat([r[fa], r[fb]]), []);
  const max = Math.max(0, ...alle), min = Math.min(0, ...alle), sp = Math.max(1, max-min);
  const ho = Math.round(DIA_H*(max/sp)), hu = DIA_H - ho;
  const bal = (v,k)=> v >= 0
    ? {o:`<div class="bl ${k}" style="height:${Math.max(2,Math.round(v/sp*DIA_H))}px"></div>`, u:`<div style="flex:1"></div>`}
    : {o:`<div style="flex:1"></div>`, u:`<div class="bl ${k} minus" style="height:${Math.max(2,Math.round(-v/sp*DIA_H))}px"></div>`};
  return `<div class="dia">`+reihe.map(r=>{ const a = bal(r[fa],""), b = bal(r[fb],"zwei");
    return `<div class="col" data-tip="${esc(tipFn(r))}"><div class="oben" style="height:${ho}px">${a.o}${b.o}</div>
      <div class="null"></div><div class="unten" style="height:${hu}px">${a.u}${b.u}</div><div class="lb">${r.kurz}</div></div>`; }).join("")+`</div>`;
}
function diaSigniert(reihe, feld, tipFn){
  const w = reihe.map(r=>r[feld]); const max = Math.max(0,...w), min = Math.min(0,...w), sp = Math.max(1,max-min);
  const ho = Math.round(DIA_H*(max/sp)), hu = DIA_H - ho;
  return `<div class="dia">`+reihe.map(r=>{ const v = r[feld];
    return `<div class="col" data-tip="${esc(tipFn(r))}"><div class="oben" style="height:${ho}px">${v>0?`<div class="bl" style="height:${Math.max(2,Math.round(v/sp*DIA_H))}px"></div>`:""}</div>
      <div class="null"></div><div class="unten" style="height:${hu}px">${v<0?`<div class="bl minus" style="height:${Math.max(2,Math.round(-v/sp*DIA_H))}px"></div>`:""}</div>
      <div class="lb">${r.kurz}</div></div>`; }).join("")+`</div>`;
}

/* ---------- KPI cards (Design Lab KPI card) ----------------------------
   Value, a line over the last 12 months to the period end (drawn in real pixels so the travelling light stays round;
   length, colour, speed: the look's --spark-* tokens) and a delta against the period before. Effects listen to
   'dl:spark' and 'dl:number'. Figures and lines replay only when the period or its figures change. */
let KPI_ZULETZT = "", KPI_REIHE = null;
const MK = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const vorMonat = ym => E.monatPlus(ym, -1);
function cfMonat(K, per, ym){ const c = vorMonat(ym); return per.indexOf(ym) >= 0 && per.indexOf(c) >= 0 ? cfDirektZwischen(K, state, ym, c) : null; }
function kpiKarten(p, er, k, cfU, b){
  const box = $("#ue-leiste"); if(!box) return;
  /* the line: 12 months ending with the period's last month, or with this month while the period is still running
     (planned spread releases later in the year do not count as "already happened") */
  const jetzt = new Date(), heuteM = jetzt.getFullYear()+"-"+String(jetzt.getMonth()+1).padStart(2,"0");
  const ende = (heuteM < p.bis.slice(0,7) && heuteM >= p.von.slice(0,7)) ? heuteM : p.bis.slice(0,7);
  /* the period before: the same rule as the comparison "previous period" on the statements */
  const s = (p.k === "J" || p.ytd) ? -12 : (p.k.charAt(0) === "Q" ? -3 : -1);
  const vvon = E.monatPlus(p.von.slice(0,7), s)+"-01", vbis = E.monatsende(E.monatPlus(p.bis.slice(0,7), s));
  const vm = +vvon.slice(5,7), label = s === -12 ? (p.ytd || p.k === "J" ? vvon.slice(0,4) : MK[vm-1]+" "+vvon.slice(0,4)) : (s === -3 ? "Q"+(Math.floor((vm-1)/3)+1) : MK[vm-1]);
  const erV = E.erfolg(state, ix, vvon, vbis), bV = E.bilanz(state, ix, vvon, vbis);
  const K = fsKern(), per = K.periods();
  const cfV = (()=>{ const kp = vbis.slice(0,7), kc = vorMonat(vvon.slice(0,7)); return per.indexOf(kp) >= 0 && per.indexOf(kc) >= 0 && kp !== kc ? cfDirektZwischen(K, state, kp, kc) : null; })();
  const vorDa = !!(erV.ertrag || erV.aufwand);
  const monate = []; for(let i=11;i>=0;i--) monate.push(E.monatPlus(ende, -i));
  /* the 12 monthly points are kept until the books change (every change goes through markiere) */
  const cKey = ende+"|"+(state.buchungen||[]).length;

  const reihe = KPI_REIHE.reihe;
  const linie = feld => reihe.map(r=>r[feld]).filter(v=> v !== null && isFinite(v));
  const d = (x, einheit, besser, titel, kompakt) => (x === null || !isFinite(x) || Math.abs(x) < (kompakt ? .5 : .05)) ? null :
    {txt:(x > 0 ? "+" : "\u2212")+(kompakt ? fk(Math.abs(x)) : Math.abs(x).toFixed(1))+(einheit ? " "+einheit : "")+" vs "+label, gut:(x > 0) === (besser > 0), titel:titel+" vs "+fd(vvon)+" to "+fd(vbis)};
  const ekQ = b.aktiven.summe ? b.eigenkapital/b.aktiven.summe*100 : null, ekQV = bV.aktiven.summe ? bV.eigenkapital/bV.aktiven.summe*100 : null;
  const fcf = cfU ? K.r2(cfU.operating + cfU.investing) : null, fcfV = cfV ? K.r2(cfV.operating + cfV.investing) : null;
  const n = Math.max(1, monate.filter(ym=> ym >= p.von.slice(0,7) && ym <= p.bis.slice(0,7) && ym <= ende).length);
  const karten = [
    {l:"Income", v:er.ertrag, fmt:fz, linie:linie("ertrag"), d: vorDa ? d(er.ertrag - erV.ertrag, "", 1, "Income", true) : null, fuss:"\u2300 "+fk(er.ertrag/n)+" a month"},
    {l:"Expenses", v:er.aufwand, fmt:fz, linie:linie("aufwand"), d: vorDa ? d(er.aufwand - erV.aufwand, "", -1, "Expenses", true) : null, fuss:"\u2300 "+fk(er.aufwand/n)+" a month"},
    {l:"Result", v:er.ergebnis, fmt:fz, linie:linie("ergebnis"), d: vorDa ? d(er.ergebnis - erV.ergebnis, "", 1, "Result", true) : null, fuss:"savings rate "+pz(er.ertrag ? er.ergebnis/er.ertrag : null)},
    {l:"Equity ratio", v:ekQ, fmt:x=>x.toFixed(1)+"%", linie:linie("ek"), d: vorDa && ekQV !== null && ekQ !== null ? d(ekQ - ekQV, "pts", 1, "Equity ratio, in percentage points,") : null, fuss:"at "+fd(p.bis)},
    {l:"Operating cash flow", v:cfU ? cfU.operating : null, fmt:fz, linie:linie("ocf"), d: cfU && cfV && vorDa ? d(cfU.operating - cfV.operating, "", 1, "Operating cash flow", true) : null, fuss:"direct method"},
    {l:"Free cash flow", v:fcf, fmt:fz, linie:linie("fcf"), d: fcf !== null && fcfV !== null && vorDa ? d(fcf - fcfV, "", 1, "Free cash flow", true) : null, fuss:"after investing"}
  ];
  const schluessel = [p.von, p.bis, state.buchungen.length].concat(karten.map(x=> x.v === null ? "" : E.r2(x.v))).join("|");
  const lauf = BEWEGUNG && schluessel !== KPI_ZULETZT; KPI_ZULETZT = schluessel;
  box.innerHTML = karten.map(x=>`<div class="card kpi"><div><div class="kpi__label"><span>${x.l}</span></div><div class="kpi__value${x.v !== null && x.v < 0 ? " neg" : ""}"><b>${x.v === null ? "\u2013" : x.fmt(x.v)}</b></div></div>
    <div><svg class="spark" aria-hidden="true"></svg><div class="kpi__foot">${x.d ? `<span class="delta ${x.d.gut ? "delta--up" : "delta--flat"}" title="${esc(x.d.titel)}">${esc(x.d.txt)}</span>` : ""}<span>${esc(x.fuss)}</span></div></div></div>`).join("");
  const bs = [...box.querySelectorAll(".kpi__value b")], sv = [...box.querySelectorAll("svg.spark")];

function zaehleKpi(el, ziel, fmt){
  const fertig = () => el.dispatchEvent(new CustomEvent("dl:number", {bubbles:true}));
  if(window.Kit && Kit.numberReveal(el, 0, ziel, fmt, fertig)) return;
  const t0 = performance.now(), dauer = 800;
  const schritt = t => { const x = Math.min(1, (t - t0) / dauer), e = 1 - Math.pow(1 - x, 3); el.textContent = fmt(ziel * e); if(x < 1) requestAnimationFrame(schritt); else { el.textContent = fmt(ziel); fertig(); } };
  requestAnimationFrame(schritt);
}
function kpiGlatt(pts){
  let d = "M"+pts[0][0].toFixed(1)+","+pts[0][1].toFixed(1);
  for(let i=1;i<pts.length;i++){ const a = pts[i-1], q = pts[i], mx = (a[0]+q[0])/2; d += "C"+mx.toFixed(1)+","+a[1].toFixed(1)+" "+mx.toFixed(1)+","+q[1].toFixed(1)+" "+q[0].toFixed(1)+","+q[1].toFixed(1); }
  return d;
}
function kpiSignal(el, phase){ try{ el.dispatchEvent(new CustomEvent("dl:spark", {bubbles:true, detail:{phase:phase}})); }catch(e){} }
function kpiSpark(sv, data, lauf, delay){
  const W = Math.max(40, Math.round(sv.getBoundingClientRect().width || 160)), H = 34, px = 4, py = 5;
  sv.setAttribute("viewBox", "0 0 "+W+" "+H);
  sv.innerHTML = '<path class="spark__glow"/><path class="spark__line"/><path class="spark__trail t1"/><path class="spark__trail t2"/><path class="spark__trail t3"/><circle class="spark__head" r="2.6"/>';
  let d = "";
  if(data.length > 1){ const lo = Math.min(...data), hi = Math.max(...data), r = hi - lo || 1;
    d = kpiGlatt(data.map((v,i)=>[px + i/(data.length-1)*(W-2*px), H - py - (v-lo)/r*(H-2*py)])); }
  sv.querySelectorAll(".spark__glow, .spark__line, .spark__trail").forEach(q=>q.setAttribute("d", d));
  const line = sv.querySelector(".spark__line"), total = d && line.getTotalLength ? line.getTotalLength() : 0;
  if(!lauf || !total){ sv.classList.add("is-done"); kpiSignal(sv, "rest"); return; }
  const dur = Number(Kit.tok("--spark-dur")) || 1100, tl = Number(Kit.tok("--spark-trail-len")) || .25, glow = sv.querySelector(".spark__glow"), head = sv.querySelector(".spark__head");
  const trails = [[".t1",1],[".t2",.5],[".t3",.2]].map(([c,fa])=>[sv.querySelector(c), Math.max(4, tl*fa*total)]);
  [line, glow].forEach(q=>{ q.style.strokeDasharray = total+" "+total; q.style.strokeDashoffset = total; });
  trails.forEach(([q])=>{ q.style.strokeDasharray = "0 "+total*2; });
  head.setAttribute("transform", "translate(-20 -20)");
  sv.classList.add("is-running"); kpiSignal(sv, "start");
  const t0 = performance.now() + delay, ease = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;
  (function schritt(now){
    if(!sv.isConnected) return;
    const x = Math.max(0, Math.min(1, (now - t0)/dur)), dd = ease(x)*total;
    line.style.strokeDashoffset = total - dd; glow.style.strokeDashoffset = total - dd;
    trails.forEach(([q,L])=>{ const l = Math.min(L, dd); q.style.strokeDasharray = l+" "+total*2; q.style.strokeDashoffset = -(dd - l); });
    if(x > 0){ const pt = line.getPointAtLength(dd); head.setAttribute("transform", "translate("+pt.x.toFixed(2)+" "+pt.y.toFixed(2)+")"); }
    if(x < 1) requestAnimationFrame(schritt);
    else { line.style.strokeDasharray = ""; line.style.strokeDashoffset = ""; sv.classList.remove("is-running"); sv.classList.add("is-done"); kpiSignal(sv, "end"); }
  })(performance.now());
}

let suche = "";
function planTag(b){
  if(!b.plan) return "";

  if(b.plan.rolle === "uebertrag") return ` <span class="chip">Spread, carried over</span>`;

// A booking as one line: amount, debit and credit account. Split bookings keep their lines below.
function buchungsform(b){
  const soll = b.z.filter(z=>E.r2((z[1]||0)-(z[2]||0)) > 0), haben = b.z.filter(z=>E.r2((z[2]||0)-(z[1]||0)) > 0);
  const betrag = E.r2(soll.reduce((a,z)=>a+(z[1]||0)-(z[2]||0),0));
  const einzel = soll.length === 1 && haben.length === 1 && !soll[0][5] && !haben[0][5];
  // lines shown below the head row: the side(s) with more than one account
  const teile = einzel ? [] : (soll.length === 1 ? haben : (haben.length === 1 ? soll : soll.concat(haben)));
  return {soll:soll, haben:haben, betrag:betrag, einzel:einzel, teile:teile,
    sollNr: soll.length === 1 ? soll[0][0] : "", habenNr: haben.length === 1 ? haben[0][0] : ""};
}

/* ---------- Journal exports: one month (yyyy-mm) or the whole year ----- */
function journalDaten(monat){
  const von = monat ? monat+"-01" : state.jahr+"-01-01", bis = monat ? E.monatsende(monat) : state.jahr+"-12-31";
  const liste = state.buchungen.filter(b=>E.istDatum(b.datum) && b.datum>=von && b.datum<=bis)
    .sort((a,b)=> a.datum===b.datum ? String(a.id).localeCompare(String(b.id)) : (a.datum<b.datum?-1:1));
  const monate = {};
  liste.forEach(b=>{ (monate[b.datum.slice(0,7)] = monate[b.datum.slice(0,7)]||[]).push(b); });
  const titel = monat ? E.MONATE[+monat.slice(5,7)-1]+" "+monat.slice(0,4) : "Year "+state.jahr;
  return {liste:liste, monate:monate, titel:titel, name:monat ? monat : String(state.jahr)};
}
function journalExcel(monat){
  const d = journalDaten(monat);
  if(!d.liste.length){ meldung("No bookings in "+d.titel+".", {fehler:true}); return; }
  // one flat table for filtering: header in row 1, no title, blank or total rows. A split booking becomes one row
  // per part, each with its own debit and credit account, so every row is a complete posting and the sums add up.
  const z = [["Date","Month","No.","Text","Line text","Amount","Debit","Debit account","Credit","Credit account"].map(t=>({v:t, s:10}))];
  d.liste.forEach(b=>{
    const bf = buchungsform(b), kopf = [xlDatum(b.datum), b.datum.slice(0,7), String(b.id), b.text||""];
    const zeile = (zt, betrag, s, h) => z.push(kopf.concat([zt, betrag, xlNr(s), s ? kontoName(s) : "", xlNr(h), h ? kontoName(h) : ""]));
    if(!bf.teile.length){ zeile(fwText(bf.soll[0]) || fwText(bf.haben[0]), bf.betrag, bf.sollNr, bf.habenNr); return; }
    bf.teile.forEach(x=>{ const s = E.r2((x[1]||0)-(x[2]||0)) > 0;
      zeile([x[5]||"", fwText(x)].filter(Boolean).join(" · "), Math.abs(E.r2((x[1]||0)-(x[2]||0))), s ? x[0] : bf.sollNr, s ? bf.habenNr : x[0]); });
  });
  ablegen(new Blob([xlsxDatei([{name:"Journal "+d.name, zeilen:z, breiten:[11,9,8,44,30,14,9,30,9,30], frieren:1, filter:true}])], {type:XLSX_TYP}),
    heute()+"_JOURNAL "+d.name+" "+dateiName(state.mandant)+".xlsx");
  meldung("Journal "+d.titel+" created as Excel.");
}

const LINIEN_STIL = `<style>#bericht table.linie{table-layout:fixed;font-size:8.6pt}

/* ---------- Ledger exports: selected account, one month or the year --- */
function hbExportDaten(monat){
  const nr = state.ui.hbKonto, k = ix.km[nr];
  const von = monat ? monat+"-01" : state.jahr+"-01-01", bis = monat ? E.monatsende(monat) : state.jahr+"-12-31";
  const titel = monat ? E.MONATE[+monat.slice(5,7)-1]+" "+monat.slice(0,4) : "Year "+state.jahr;
  return {nr:nr, k:k, wkz:k.wkz, monat:monat, hb:E.hauptbuch(state, ix, nr, von, bis), titel:titel, name:(monat||String(state.jahr))+" "+nr};
}
// Excel cells: a real date (filterable by year/month/day) and account numbers as numbers where they are plain digits
function xlDatum(iso){ const t = iso.split("-").map(Number); return {v:(Date.UTC(t[0], t[1]-1, t[2]) - Date.UTC(1899, 11, 30)) / 86400000, s:11}; }
function xlNr(nr){ return !nr ? "" : (/^\d+$/.test(nr) ? {v:parseFloat(nr), s:0} : nr); }
function hbGegen(nr){ return nr === "div." ? "Split" : (nr === "—" ? "" : nr); }
function ledgerExcel(monat){
  const d = hbExportDaten(monat), hb = d.hb, w = d.wkz;
  // flat table for filtering: header in row 1, the opening balance as the first row, the last balance is the closing one
  const z = [["Date","Month","No.","Text","Contra","Contra account","Debit","Credit"].concat(w?[w]:[]).concat(["Balance"]).map(t=>({v:t, s:10}))];
  const von = d.monat ? d.monat+"-01" : state.jahr+"-01-01";
  z.push([xlDatum(von), von.slice(0,7), "", "Opening balance", "", "", "", ""].concat(w?[hb.fwAnfang]:[]).concat([hb.anfang]));
  hb.zeilen.forEach(x=>{ const g = hbGegen(x.gegenkonto);
    z.push([xlDatum(x.datum), x.datum.slice(0,7), String(x.id), x.text||"", xlNr(g), ix.km[g] ? kontoName(g) : "", x.soll||"", x.haben||""]
      .concat(w?[x.fw ? (x.soll ? x.fw : -x.fw) : ""]:[]).concat([x.saldo])); });
  ablegen(new Blob([xlsxDatei([{name:"Ledger "+d.nr, zeilen:z, breiten:[11,9,8,44,9,28,14,14].concat(w?[14]:[]).concat([15]), frieren:1, filter:true}])], {type:XLSX_TYP}),
    heute()+"_LEDGER "+d.name+" "+dateiName(state.mandant)+".xlsx");
  meldung("Ledger "+d.nr+", "+d.titel+" created as Excel.");
}
function ledgerPdf(monat){

      <th style="width:26mm">Debit</th><th style="width:26mm">Credit</th>${w?`<th style="width:24mm">${esc(w)}</th>`:""}<th style="width:28mm">Balance</th></tr></thead><tbody>

        ${leer(x.soll)}${leer(x.haben)}${w?`<td class="z">${x.fw?(x.soll?"":"−")+fz(x.fw):""}</td>`:""}${z(x.saldo)}</tr>`; }).join("")+

function journalCsv(){
  const p = periodeAktiv();

    const ein = state.einstellungen, zeilen = []; let diff = 0;
    nb.forEach(z=>{ if(Math.abs(z.differenz)<.005) return; diff = E.r2(diff+z.differenz);
      zeilen.push({k:z.nr, s:z.differenz>0?String(z.differenz):"", h:z.differenz<0?String(-z.differenz):"", t:"", fw:"", kurs:""}); });
    zeilen.push({k: diff>0 ? ein.kursgewinn : ein.kursverlust, s:diff<0?String(-diff):"", h:diff>0?String(diff):"", t:"", fw:"", kurs:""});
    neuerEntwurf(); entwurf.modus = "zeilen"; entwurf.datum = p.bis; entwurf.text = "Revaluation of foreign currencies at "+fd(p.bis); entwurf.z = zeilen;
    zeigeTab("buchen");
  };
}

    state.gruppen.filter(g=>g.s==="E").map(g=>`<tr><td>${pf(g.c)}</td>
      <td><input class="eingabe" style="${inp}" data-g="${esc(g.c)}" data-f="t" value="${esc(g.t)}"></td>
      <td><select class="eingabe" style="${sel}" data-g="${esc(g.c)}" data-f="vz"><option value="-1"${g.vz===-1?" selected":""}>Income</option><option value="1"${g.vz!==-1?" selected":""}>Expense</option></select></td>
      <td><input class="eingabe" style="${inp}" data-g="${esc(g.c)}" data-f="zwBlock" value="${esc(g.zwBlock||"")}" placeholder="none"></td>
      <td><input class="eingabe" style="${inp}" data-g="${esc(g.c)}" data-f="zw" value="${esc(g.zw||"")}" placeholder="none"></td>
      <td>${weg(g.c)}</td></tr>`).join("")+`</tbody></table>`;
  $("#gr-titel").innerHTML = `<div class="zweispaltig"><div><h2 style="font-size:14px">Sections and totals</h2><table><tbody>`+
    Object.keys(state.sektionen).map(k=>`<tr><td style="width:150px" class="mut klein">Section ${esc(k)}</td><td><input class="eingabe" data-sek="${esc(k)}" value="${esc(state.sektionen[k])}"></td></tr>`).join("")+

  const verschiebe = (c, r)=> aendere("Order changed", ()=>{
    const i = state.gruppen.findIndex(g=>g.c===c), g = state.gruppen[i];
    const passt = x => g.s==="E" ? x.s==="E" : (x.s!=="E" && x.sek===g.sek);
    let j = i + r; while(j>=0 && j<state.gruppen.length && !passt(state.gruppen[j])) j += r;
    if(j<0 || j>=state.gruppen.length) return;

      else if(el.dataset.f === "sek"){ const t = v.split("|"); g.s = t[0]; g.sek = t[1]; }
      else g[el.dataset.f] = v;
    }, {geruest:true});
  });
  $$("#p-aufbau [data-sek]").forEach(el=> el.onchange = ()=> aendere("Label changed", ()=>{ state.sektionen[el.dataset.sek] = el.value; }));
  $$("#p-aufbau [data-titel]").forEach(el=> el.onchange = ()=> aendere("Label changed", ()=>{ state.titel[el.dataset.titel] = el.value; }));
}

async function jahrSchliessen(j){
  const b = E.bilanz(state, ix, j+"-01-01", j+"-12-31");
  const schief = E.kontrolle(state, ix).schief.filter(id=>{ const x = state.buchungen.find(y=>y.id===id); return x && String(x.datum).slice(0,4)===String(j); });
  if(Math.abs(b.differenz) >= .005 || schief.length){ meldung("Year "+j+" cannot be closed: "+(schief.length ? schief.length+" faulty booking(s)." : "the balance sheet is off by "+fz(b.differenz)+"."), {fehler:true}); return; }
  const checks = E.abschlussPruefung(state, ix, j);
  const liste = checks.length
    ? "<p style='margin:12px 0 6px'><b>Closing checklist, "+checks.length+" point"+(checks.length>1?"s":"")+" to look at:</b></p><ul style='margin:0;padding-left:18px'>"+checks.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul><p class='mut' style='margin:10px 0 0'>You can close anyway and reopen the year later.</p>"
    : "<p style='margin:12px 0 0'><span class='chip gruen'>Checklist clear</span> clearing accounts, in-year accruals, foreign currencies, spreads and balance signs are in order.</p>";
  const ok = await frage("Close year "+j+"?", "Its bookings can then no longer be added, changed or deleted. The closing stays the opening of "+(j+1)+". You can reopen the year here at any time."+liste,
    [{text:"Cancel", wert:false, art:"leicht"}, {text:checks.length ? "Close anyway" : "Close year", wert:true, art: checks.length ? "gefahr" : ""}]);
  if(ok) aendere("Year "+j+" closed", ()=>{ state.abgeschlossen = (state.abgeschlossen||[]).filter(x=>x!==j).concat([j]).sort((a,c)=>a-c); }, {jahreFrei:true, geruest:true});
}
async function jahrOeffnen(j){
  const ok = await frage("Reopen year "+j+"?", "Its bookings become changeable again. Every change also changes the opening balances of the following years.",
    [{text:"Cancel", wert:false, art:"leicht"}, {text:"Reopen", wert:true, art:"gefahr"}]);
  if(ok) aendere("Year "+j+" reopened", ()=>{ state.abgeschlossen = (state.abgeschlossen||[]).filter(x=>x!==j); }, {jahreFrei:true, geruest:true});
}

/* ---------- Years ---------------------------------------------------- */
function jahresTabelle(zeilen, sp, delta){
  const kopf = `<tr><th></th>`+sp.map((s,i)=> (delta && i>0 ? `<th class="num delta">Change</th>` : "")+
    `<th class="num">${esc(s.label)}<small>${s.importiert?"imported":"this file"}</small></th>`).join("")+`</tr>`;
  const spalten = sp.length + (delta ? sp.length-1 : 0) + 1;
  return `<table><thead>${kopf}</thead><tbody>`+zeilen.map(z=>{
    if(z.typ === "seite" || z.typ === "bereich") return `<tr class="${z.typ==="bereich"?"bereich":"teil"}"><td colspan="${spalten}">${esc(z.text)}</td></tr>`;
    const zellen = z.werte.map((v,i)=>{
      let h = "";
      if(delta && i > 0){ const dlt = E.r2(v - z.werte[i-1]);
        h += `<td class="num delta" data-tip="${esc(`<b>${esc(z.text)}</b>`+tipZeile(sp[i-1].label+" to "+sp[i].label, fz(dlt))+tipZeile("Change in %", z.werte[i-1] ? pz(dlt/Math.abs(z.werte[i-1])) : "–"))}">${Math.abs(dlt)<.005?"–":(dlt>0?"+":"\u2212")+betrag(Math.abs(dlt))}</td>`; }
      return h + `<td class="${cls(v)}" data-tip="${esc(`<b>${esc(z.text)}</b>`+tipZeile(sp[i].label, fz(v))+(i>0?tipZeile("vs "+sp[i-1].label, fz(E.r2(v-z.werte[i-1]))):""))}">${f(v)}</td>`;
    }).join("");
    return `<tr class="${z.typ}"${z.nr?` data-k="${esc(z.nr)}" style="cursor:pointer"`:""}><td class="${z.einzug?"einzug":""}" title="${esc((z.nr?z.nr+" ":"")+z.text)}">${z.nr?`<span class="nr">${esc(z.nr)}</span> `:""}${esc(z.text)}</td>${zellen}</tr>`;
  }).join("")+`</tbody></table>`;
}

/* ---------- Collapsible groups on Years and Twelve months ------------- */
const ZU = {jahre:new Set(), monate:new Set()};
function klappbar(seite, tbl){
  let gruppe = null, nr = 0;
  $$("tbody tr", tbl).forEach(tr=>{
    if(tr.classList.contains("gruppe")){
      gruppe = seite+"|"+(nr++)+"|"+tr.querySelector("td").textContent.trim();
      tr.dataset.grp = gruppe; tr.classList.add("klappbar");
      const td = tr.querySelector("td"); if(!td.querySelector(".chev")) td.insertAdjacentHTML("afterbegin", `<span class="chev">▸</span>`);   // one chevron (the statements engine may already draw one)
      tr.classList.toggle("open", !ZU[seite].has(gruppe));
      tr.onclick = ()=>{ const g = tr.dataset.grp; ZU[seite].has(g) ? ZU[seite].delete(g) : ZU[seite].add(g); klappAnwenden(seite, tbl); };
      return;
    }
    if(tr.querySelector("td.einzug") && gruppe){ tr.dataset.von = gruppe; return; }
    gruppe = null;
  });
  klappAnwenden(seite, tbl);
}
function klappAnwenden(seite, tbl){
  $$("tr[data-grp]", tbl).forEach(tr=> tr.classList.toggle("open", !ZU[seite].has(tr.dataset.grp)));
  $$("tr[data-von]", tbl).forEach(tr=> tr.classList.toggle("zu", ZU[seite].has(tr.dataset.von)));
}
$$("[data-alle]").forEach(b=> b.onclick = ()=>{
  const seite = b.dataset.alle, auf = b.dataset.auf === "1", box = $("#p-"+seite);
  $$("tr[data-grp]", box).forEach(tr=> auf ? ZU[seite].delete(tr.dataset.grp) : ZU[seite].add(tr.dataset.grp));
  $$("table", box).forEach(t=> klappAnwenden(seite, t));
});
