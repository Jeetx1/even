<script id="engine-plus">
/* =========================================================================
   ENGINE-PLUS — ebenfalls reine Logik, ohne DOM. Alles hier ist testbar.
   ========================================================================= */
(function(E){
"use strict";
const r2 = E.r2;

/* ---- Zahlen robust lesen -------------------------------------------- */
// Regeln, bewusst einfach und vorhersehbar:
// - Apostrophe, Leerzeichen und geschützte Leerzeichen sind Tausendertrenner.
// - Stehen Punkt und Komma beide drin, ist das letzte der Dezimaltrenner.
// - Ein einzelner Punkt oder ein einzelnes Komma ist der Dezimaltrenner.
// - Mehrere gleiche Trenner sind Tausendertrenner.
// - (123), 123- und −123 sind negativ.
function zahl(s){
  if(typeof s === "number") return isFinite(s) ? s : NaN;
  if(s === null || s === undefined) return NaN;
  let t = String(s).trim();
  if(!t) return NaN;
  let neg = false;
  if(/^\(.*\)$/.test(t)){ neg = true; t = t.slice(1,-1).trim(); }
  t = t.replace(/[\u2212\u2013\u2014]/g, "-");
  t = t.replace(/^(CHF|EUR|USD|GBP|Fr\.|SFr\.)\s*/i, "").replace(/\s*(CHF|EUR|USD|GBP)$/i, "");
  if(/-$/.test(t)){ neg = !neg; t = t.slice(0,-1).trim(); }
  if(/^-/.test(t)){ neg = !neg; t = t.slice(1).trim(); }
  if(/^\+/.test(t)) t = t.slice(1);
  t = t.replace(/['\u2019\u00A0\u202F\s]/g, "");
  if(!/^[0-9.,]+$/.test(t)) return NaN;
  const p = t.lastIndexOf("."), k = t.lastIndexOf(",");
  if(p >= 0 && k >= 0){
    const dez = p > k ? "." : ",";
    t = t.split(dez === "." ? "," : ".").join("");
    if(dez === ",") t = t.replace(",", ".");
  }else if(k >= 0){
    const teile = t.split(",");
    t = teile.length > 2 ? teile.join("") : teile.join(".");
  }else if(p >= 0){
    const teile = t.split(".");
    if(teile.length > 2) t = teile.join("");
  }
  if(!/^\d*\.?\d*$/.test(t) || t === "" || t === ".") return NaN;
  const n = parseFloat(t);
  return isFinite(n) ? (neg ? -n : n) : NaN;
}
function nachkomma(n){ const s = String(n); const i = s.indexOf("."); return i < 0 ? 0 : s.length - i - 1; }

/* ---- Datum ---------------------------------------------------------- */
function istDatum(d){
  if(typeof d !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return false;
  const t = d.split("-").map(Number);
  const x = new Date(Date.UTC(t[0], t[1]-1, t[2]));
  return x.getUTCFullYear()===t[0] && x.getUTCMonth()===t[1]-1 && x.getUTCDate()===t[2];
}
function reparDatum(d){
  if(istDatum(d)) return d;
  const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(d||"").trim());
  if(m){ const x = m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"); if(istDatum(x)) return x; }
  return null;
}
function monatPlus(ym, n){
  const t = ym.split("-").map(Number);
  const d = new Date(Date.UTC(t[0], t[1]-1+n, 1));
  return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0");
}
function monatsende(ym){ const t = ym.split("-").map(Number); return E.letzterTag(t[0], t[1]); }

/* ---- Datei prüfen und reparieren ------------------------------------ */
/* one booking line as the file keeps it: [account, debit, credit], then [foreign amount, rate] and the line text when
   there are any; anything after the line text stays. Amounts to the cent, a negative amount moves to the other side,
   a line without an amount is null. The same rule for a file that is opened and for every change (aendere), so what
   is in the window always reads back the same from the file. info.gedreht counts the moved amounts */
function zeileNorm(x, info){
  if(!Array.isArray(x) || x[0]===undefined || x[0]===null) return null;
  let s = zahl(x[1]), h = zahl(x[2]);
  s = isFinite(s) ? r2(s) : 0; h = isFinite(h) ? r2(h) : 0;
  if(s < 0){ h = r2(h - s); s = 0; if(info) info.gedreht++; }
  if(h < 0){ s = r2(s - h); h = 0; if(info) info.gedreht++; }
  if(!s && !h) return null;
  const zeile = [String(x[0]).trim(), s, h];
  const fw = zahl(x[3]), kurs = zahl(x[4]);
  const hatFW = isFinite(fw) && fw && isFinite(kurs) && kurs;
  const text = typeof x[5] === "string" ? x[5].trim() : "", rest = x.slice(6);
  if(hatFW || text || rest.length){ zeile.push(hatFW ? r2(Math.abs(fw)) : 0); zeile.push(hatFW ? kurs : 0); }
  if(text || rest.length) zeile.push(text);
  return zeile.concat(rest);
}
const EINSTELLUNGEN = {ara:"1300", araJahr:"1305", pra:"2300", praJahr:"2305", gewinnvortrag:"2800", kursgewinn:"6999", kursverlust:"6949", abgangGewinn:"6815", abgangVerlust:"6810", ersteller:""};
function pruefeDatei(roh, vorlage){
  const w = [], f = [];
  if(!roh || typeof roh !== "object" || Array.isArray(roh)) return {fehler:["The file contains no accounting data."], warnungen:w};
  if(!Array.isArray(roh.konten))    f.push("The chart of accounts is missing from the file.");
  if(!Array.isArray(roh.buchungen)) f.push("The bookings are missing from the file.");
  if(f.length) return {fehler:f, warnungen:w};
  const klon = o => JSON.parse(JSON.stringify(o));

  // Aufbau
  let gruppen = Array.isArray(roh.gruppen) && roh.gruppen.length ? roh.gruppen.filter(g=>g && g.c && g.s) : klon(vorlage.gruppen);
  if(!gruppen.length) gruppen = klon(vorlage.gruppen);
  const gm = {}; gruppen.forEach(g=> gm[g.c] = g);
  let buckets = Array.isArray(roh.buckets) && roh.buckets.length ? roh.buckets.filter(b=>b && b.b) : klon(vorlage.buckets);
  vorlage.buckets.forEach(b=>{ if(!buckets.some(x=>x.b===b.b)) buckets.push(klon(b)); });
  const sektionen = Object.assign(klon(vorlage.sektionen), roh.sektionen||{});
  const titel = Object.assign(klon(vorlage.titel), roh.titel||{});
  const einstellungen = Object.assign({}, EINSTELLUNGEN, roh.einstellungen||{});

  // Ersatzgruppe nach erster Ziffer, falls ein Konto auf eine unbekannte Gruppe zeigt
  const ersatz = nr => {
    const z = String(nr).charAt(0);
    const finde = fn => (gruppen.find(fn)||{}).c;
    if(z === "1") return finde(g=>g.s==="A");
    if(z === "2") return finde(g=>g.s==="P" && g.sek==="KFK") || finde(g=>g.s==="P");
    if(z === "3") return finde(g=>g.s==="E" && g.vz===-1);
    return finde(g=>g.s==="E" && g.vz!==-1) || finde(g=>g.s==="E");
  };

  // Konten
  const konten = [], gesehen = {};
  roh.konten.forEach((k,i)=>{
    const o = Array.isArray(k) ? {nr:k[0], name:k[1], grp:k[2], cf:k[3], wkz:k[4]} : (k||{});
    const nr = o.nr === undefined || o.nr === null ? "" : String(o.nr).trim();
    if(!nr){ w.push("Account entry "+(i+1)+" has no number and was skipped."); return; }
    if(gesehen[nr]){ w.push("Account "+nr+" was listed twice; the second entry was skipped."); return; }
    gesehen[nr] = true;
    let g = o.grp;
    if(!gm[g]){
      const neu = ersatz(nr);
      w.push("Account "+nr+" pointed to an unknown group and was placed in “"+(gm[neu]?gm[neu].t:neu)+"”. Please check.");
      g = neu;
    }
    const cf = o.cf && (buckets.some(b=>b.b===o.cf) || o.cf === "nc" || o.cf === "cash") ? o.cf : null;
    konten.push([nr, String(o.name||("Konto "+nr)), g, cf, o.wkz ? String(o.wkz).toUpperCase() : null].concat(Array.isArray(k) ? k.slice(5) : []));
  });
  const km = {}; konten.forEach(k=> km[k[0]] = true);

  // Buchungen
  const buchungen = [], ids = {}, alleIds = new Set(roh.buchungen.map(b=> b && b.id !== undefined && b.id !== null ? String(b.id) : ""));
  const info = {gedreht:0}; let leer = 0, frei = 0;
  roh.buchungen.forEach((b,i)=>{
    if(!b || typeof b !== "object"){ w.push("Booking entry "+(i+1)+" was unreadable and was skipped."); return; }
    let id = b.id === undefined || b.id === null ? "" : String(b.id);
    if(!id || ids[id]){
      // a free ID that no other booking of the file carries
      let neu; do { neu = "r"+String(++frei).padStart(4,"0"); } while(ids[neu] || alleIds.has(neu));
      if(id) w.push("Booking ID "+id+" was duplicated; the second one is now "+neu+"."); id = neu;
    }
    ids[id] = true;
    let datum = reparDatum(b.datum);
    if(!datum){ w.push("Booking “"+(b.text||id)+"” has no valid date ("+b.datum+") and appears in no report. Fix it in the Journal under “Without a valid date”."); datum = String(b.datum||""); }
    else if(datum !== b.datum) w.push("Date of booking “"+(b.text||id)+"” converted from "+b.datum+" to "+datum+".");
    const z = [];
    (Array.isArray(b.z) ? b.z : []).forEach(x=>{
      if(!Array.isArray(x) || x[0]===undefined || x[0]===null) return;
      const zeile = zeileNorm(x, info);
      if(zeile) z.push(zeile); else leer++;
    });
    // fields this version does not know are kept, like the file's own
    const neu = Object.assign({}, b, {id:id, datum:datum, beleg:String(b.beleg||""), text:String(b.text||""), z:z});
    delete neu.eb; delete neu.plan; delete neu.virtuell;
    if(b.eb) neu.eb = true;
    if(b.plan && typeof b.plan === "object") neu.plan = b.plan;
    let ss=0, hh=0; z.forEach(x=>{ ss=r2(ss+x[1]); hh=r2(hh+x[2]); });
    if(Math.abs(ss-hh) > 0.005) w.push("Booking “"+(neu.text||id)+"” of "+datum+" does not balance (difference "+r2(ss-hh).toFixed(2)+").");
    z.forEach(x=>{ if(!km[x[0]]) w.push("Booking “"+(neu.text||id)+"” uses the unknown account "+x[0]+"."); });
    buchungen.push(neu);
  });
  if(leer) w.push(leer+" empty booking line(s) without an amount were removed.");
  if(info.gedreht) w.push(info.gedreht+" negative amount(s) were moved to the opposite side.");

  // Geschäftsjahr
  let jahr = parseInt(roh.jahr, 10);
  if(!(jahr >= 1900 && jahr <= 2200)){
    const z = {}; buchungen.forEach(b=>{ if(istDatum(b.datum)) z[b.datum.slice(0,4)] = (z[b.datum.slice(0,4)]||0)+1; });
    const best = Object.keys(z).sort((a,b)=>z[b]-z[a])[0];
    jahr = best ? parseInt(best,10) : new Date().getFullYear();
    w.push("The financial year was missing and has been set to "+jahr+".");
  }

  // Kurse
  const kurse = {};
  Object.keys(roh.kurse || vorlage.kurse || {}).forEach(c=>{
    const v = zahl((roh.kurse||vorlage.kurse)[c]);
    if(isFinite(v) && v > 0) kurse[String(c).toUpperCase()] = v;
  });

  // Vergleichsjahre
  const vergleichsjahre = [];
  (Array.isArray(roh.vergleichsjahre) ? roh.vergleichsjahre : []).forEach(v=>{
    if(!v || !(parseInt(v.jahr,10) > 1900) || !v.salden || typeof v.salden !== "object") return;
    const salden = {};
    Object.keys(v.salden).forEach(nr=>{ const x = zahl(v.salden[nr]); if(isFinite(x) && Math.abs(x) >= 0.005) salden[String(nr)] = r2(x); });
    vergleichsjahre.push(Object.assign({}, v, {jahr:parseInt(v.jahr,10), quelle:String(v.quelle||"Import"), importiert:String(v.importiert||""), salden:salden}));
  });

  const ui = Object.assign({tab:"uebersicht", periode:"J", ytd:false, vergleich:"start"}, roh.ui||{});
  // Closed years: bookings dated in them can no longer be changed
  const abgeschlossen = (Array.isArray(roh.abgeschlossen) ? roh.abgeschlossen : [])
    .map(x=>parseInt(x,10)).filter((x,i,a)=> x >= 1900 && x <= 2200 && a.indexOf(x) === i).sort((a,b)=>a-b);
  const daten = {
    typ:"buchhaltung", version:5,
    mandant: String(roh.mandant||"Untitled"), jahr:jahr,
    waehrung: String(roh.waehrung||"CHF").toUpperCase(), kurse:kurse,
    sektionen:sektionen, titel:titel, buckets:buckets, gruppen:gruppen,
    konten:konten, buchungen:buchungen, einstellungen:einstellungen,
    vergleichsjahre:vergleichsjahre, abgeschlossen:abgeschlossen, ui:ui
  };
  // Anything this version does not know is kept as it is (here, and inside bookings, lines, accounts and imported
  // closings), so no data is ever dropped on saving.
  Object.keys(roh).forEach(k=>{ if(!(k in daten)) daten[k] = roh[k]; });
  // the fixed-asset register; the groups that hold depreciable assets are flagged once from the classic
  // ranges 1500–1999 (movable, immovable, intangible) and editable on the Structure page afterwards
  daten.anlagen = (Array.isArray(roh.anlagen) ? roh.anlagen : []).filter(a=> a && a.id).map(anlageNorm);
  if(!gruppen.some(g=> "anlage" in g)) gruppen.forEach(g=>{ if(g.s === "A" && (g.r||[]).length && g.r.every(r=> r[0] >= 1500 && r[1] <= 2000)) g.anlage = true; });
  // Cash flow from the bookings (12 October): credit cards count inside cash, like an account with a negative
  // balance. Done once; afterwards the choice on Statement settings stands.
  const aw = daten.auswertung && typeof daten.auswertung === "object" ? daten.auswertung : null;
  if(!aw || !aw.cfDirekt){
    const karten = konten.map(k=> Array.isArray(k) ? {nr:String(k[0]), name:k[1]} : k)
      .filter(k=> /^2/.test(k.nr) && /kreditkarte|credit ?card|american express|mastercard/i.test(k.name||""));
    const ziel = aw || (karten.length ? (daten.auswertung = {}) : null);
    if(ziel){
      ziel.cfOverrides = ziel.cfOverrides && typeof ziel.cfOverrides === "object" ? ziel.cfOverrides : {};
      karten.forEach(k=>{ if(!ziel.cfOverrides[k.nr]) ziel.cfOverrides[k.nr] = "cash"; });
      ziel.cfDirekt = 1;
    }
  }
  // Cash flow, second step (12 October): tax accounts on the balance sheet (tax liability, current account with the
  // tax office) shown under the income statement group that holds the tax expense. Done once; editable afterwards.
  if(daten.auswertung && (daten.auswertung.cfDirekt || 0) < 2){
    const aw2 = daten.auswertung, kl = konten.map(k=> Array.isArray(k) ? {nr:String(k[0]), name:k[1], grp:k[2]} : k);
    const gs = {}; gruppen.forEach(g=> gs[g.c] = g);
    const steuerK = kl.find(k=> +k.nr >= 3000 && gs[k.grp] && gs[k.grp].s === "E" && /direkte steuern|ertragssteuer|income tax/i.test(k.name||""));
    if(steuerK){
      aw2.cfZeile = aw2.cfZeile && typeof aw2.cfZeile === "object" ? aw2.cfZeile : {};
      kl.filter(k=> +k.nr < 3000 && /direkte steuern|steuerverwaltung/i.test(k.name||"")).forEach(k=>{ if(!aw2.cfZeile[k.nr]) aw2.cfZeile[k.nr] = steuerK.grp; });
    }
    aw2.cfDirekt = 2;
  }
  return {fehler:[], warnungen:w, daten:daten};
}

/* ---- Verteilung über Monate ----------------------------------------- */
// Der volle Betrag geht zuerst auf das Abgrenzungskonto (Aufwand → ARA,
// Ertrag → PRA). Danach wird pro Monat aufgelöst – aber nur für Monate, deren
// Monatsende im laufenden Geschäftsjahr liegt. Der Rest bleibt per 31.12.
// auf dem Abgrenzungskonto stehen.
// Seit 12.10.2026 laufen Verteilungen unterjährig über araJahr (1305, Aufwand) bzw. praJahr
// (2305, Ertrag); nur der Teil fürs Folgejahr wird am 31.12. umgebucht (1300 / 1305 bzw.
// 2305 / 2300), 1305 und 2305 sind per 31.12. null. Reine Auflösungen einer
// Vorjahresabgrenzung laufen weiter über 1300 bzw. 2300.
function verteilung(state, ix, o){
  const fehler = [], warnungen = [];
  const jahr = state.jahr, ein = Object.assign({}, EINSTELLUNGEN, state.einstellungen||{});
  const ara = o.ara || ein.ara, pra = o.pra || ein.pra;
  const araJ = o.araJahr !== undefined ? o.araJahr : ein.araJahr;
  const praJ = o.praJahr !== undefined ? o.praJahr : ein.praJahr;
  const n = parseInt(o.monate, 10);
  if(!(n >= 2 && n <= 60)) fehler.push("Choose between 2 and 60 months.");
  if(!/^\d{4}-\d{2}$/.test(o.start||"")) fehler.push("Choose the first month.");
  if(!istDatum(o.datum)) fehler.push("Enter a valid booking date.");
  const zeilen = (o.zeilen||[]).filter(z=>z && ix.km[z[0]] && ((z[1]||0) || (z[2]||0)));
  const erZ = zeilen.filter(z=>E.istER(E.grp(ix, z[0])));
  if(!erZ.length) fehler.push("There is no expense or income line to spread.");
  if(erZ.some(z=>(z[1]||0)-(z[2]||0) > 0) && !ix.km[ara]) fehler.push("The accrual account "+ara+" is not in the chart of accounts.");
  if(erZ.some(z=>(z[1]||0)-(z[2]||0) < 0) && !ix.km[pra]) fehler.push("The accrual account "+pra+" is not in the chart of accounts.");
  if(fehler.length) return {ok:false, fehler:fehler, warnungen:warnungen};

  const id = o.id || ("v"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  // Basisbuchung: Erfolgszeilen ersetzt durch Abgrenzung
  let araS = 0, praH = 0;
  const basisZ = [];
  zeilen.forEach(z=>{
    if(!E.istER(E.grp(ix, z[0]))){ basisZ.push(z.slice()); return; }
    const a = r2((z[1]||0)-(z[2]||0));
    if(a > 0) araS = r2(araS + a); else praH = r2(praH - a);
  });
  const araZeile = araS ? [ara, araS, 0] : null;
  if(araZeile) basisZ.push(araZeile);
  const praZeile = praH ? [pra, 0, praH] : null;
  if(praZeile) basisZ.push(praZeile);
  // Release only: the counter line already sits on the accrual account (for example an accrual
  // from last year's closing). Then there is nothing to defer, only the monthly releases.
  const nichtER = zeilen.filter(z=>!E.istER(E.grp(ix, z[0])));
  const nurAufloesung = nichtER.length > 0 && nichtER.every(z=> (z[0] === ara && araS && (z[2]||0) > 0) || (z[0] === pra && praH && (z[1]||0) > 0));
  // in-year account for expenses: 1305 when it exists, otherwise everything stays on 1300 as before
  const araU = !nurAufloesung && araJ && araJ !== ara && ix.km[araJ] ? araJ : ara;
  if(araZeile) araZeile[0] = araU;
  const praU = !nurAufloesung && praJ && praJ !== pra && ix.km[praJ] ? praJ : pra;
  if(praZeile) praZeile[0] = praU;
  // the split per income statement account, kept on the plan: a later year continues the spread from it
  const konten = {};
  erZ.forEach(x=>{ konten[x[0]] = r2((konten[x[0]]||0) + (x[1]||0) - (x[2]||0)); });
  const basis = nurAufloesung ? null : {datum:o.datum, beleg:o.beleg||"", text:o.text||"", z:basisZ,
    plan:{id:id, rolle:"basis", monate:n, start:o.start, text:o.text||"", konten:konten}};

  const vorschau = [], aufloesungen = [];
  let rest = 0, restA = 0, restP = 0, vorJahr = 0, nachFolgejahr = 0;
  for(let i=0; i<n; i++){
    const monat = monatPlus(o.start, i);
    const z = []; let a1 = 0, p1 = 0;
    erZ.forEach(x=>{
      const a = r2((x[1]||0)-(x[2]||0));
      const teil = r2(r2(a*(i+1)/n) - r2(a*i/n));
      if(!teil) return;
      const lt = x[5] ? [0, 0, x[5]] : [];
      if(teil > 0){ z.push([x[0], teil, 0].concat(lt)); a1 = r2(a1+teil); }
      else        { z.push([x[0], 0, -teil].concat(lt)); p1 = r2(p1-teil); }
    });
    if(a1) z.push([araU, 0, a1]);
    if(p1) z.push([praU, p1, 0]);
    const ende = monatsende(monat);
    const datum = ende < o.datum ? o.datum : ende;
    const imJahr = datum.slice(0,4) === String(jahr);
    const betrag = r2(a1 + p1);
    if(parseInt(monat.slice(0,4),10) < jahr) vorJahr++;
    if(parseInt(monat.slice(0,4),10) > jahr+1) nachFolgejahr++;
    vorschau.push({nr:i+1, monat:monat, datum:datum, betrag:betrag, gebucht:imJahr});
    if(imJahr){
      aufloesungen.push({datum:datum, beleg:o.beleg||"", text:(o.text||"Spread")+" ("+(i+1)+"/"+n+")", z:z,
        plan:Object.assign({id:id, rolle:"aufloesung", nr:i+1, von:n, monat:monat}, nurAufloesung ? {total:r2(araS + praH), start:o.start, text:o.text||""} : {})});
    }else{ rest = r2(rest + betrag); restA = r2(restA + a1); restP = r2(restP + p1); }
  }
  // what belongs to next year moves to 1300 / 2300 on 31.12., so 1305 and 2305 close the year at zero
  const uz = [];
  if(araU !== ara && restA > 0.005) uz.push([ara, restA, 0], [araU, 0, restA]);
  if(praU !== pra && restP > 0.005) uz.push([praU, restP, 0], [pra, 0, restP]);
  const uebertrag = uz.length ? {datum:jahr+"-12-31", beleg:o.beleg||"", text:(o.text||"Spread")+" (carried into "+(jahr+1)+")",
    z:uz, plan:{id:id, rolle:"uebertrag"}} : null;
  if(vorJahr) warnungen.push(vorJahr+" month(s) lie before the financial year "+jahr+" and are released on the booking date.");
  if(nachFolgejahr) warnungen.push("Part of it concerns months after 31.12."+(jahr+1)+". Check whether that share belongs in a long-term accrual.");
  if(o.datum.slice(0,4) !== String(jahr)) warnungen.push("The booking date is outside the financial year "+jahr+".");
  return {ok:true, fehler:[], warnungen:warnungen, id:id, basis:basis, aufloesungen:aufloesungen, uebertrag:uebertrag,

  if(g) return (g.s === "A" || (g.s === "E" && g.vz !== -1)) ? "soll" : "haben";
  const z = String(nr).charAt(0);
  return (z === "2" || z === "3") ? "haben" : "soll";
}
function erkenneVorzeichen(analyse, spalte, ix){
  let sp=0, sn=0, hp=0, hn=0;
  analyse.konten.forEach(k=>{
    const v = k.werte[spalte]; if(!v || !ix.km[k.nr]) return;
    if(natur(ix, k.nr) === "soll"){ if(v > 0) sp++; else sn++; } else { if(v > 0) hp++; else hn++; }
  });
  const sollPos = sp+sn ? sp/(sp+sn) : 1, habenNeg = hp+hn ? hn/(hp+hn) : 0;
  if(sollPos >= 0.6 && habenNeg >= 0.6) return "soll";
  if(sollPos >= 0.6 && habenNeg <= 0.4) return "betrag";
  if(sollPos <= 0.4 && habenNeg <= 0.4) return "haben";
  return "soll";
}
function saldenAusImport(analyse, spalte, modus, ix, zuordnung){
  zuordnung = zuordnung || {};
  const salden = {}, unbekannt = [];
  let mehrStellen = 0;
  analyse.konten.forEach(k=>{
    const v = k.werte[spalte] || 0;
    if(nachkomma(v) > 2) mehrStellen++;
    const bekannt = !!ix.km[k.nr] || !!zuordnung[k.nr];
    const nat = ix.km[k.nr] ? natur(ix, k.nr) : (zuordnung[k.nr] ? zuordnung[k.nr].natur : natur(ix, k.nr));
    const aktiv = ix.km[k.nr] ? (E.grp(ix,k.nr).s === "A") : (zuordnung[k.nr] ? zuordnung[k.nr].aktiv : parseFloat(k.nr) < 2000);
    let s = modus === "haben" ? -v : (modus === "betrag" ? (nat === "soll" ? v : -v) : (modus === "darstellung" ? (aktiv ? v : -v) : v));
    s = r2(s);
    if(!bekannt){ if(Math.abs(s) >= 0.005) unbekannt.push({nr:k.nr, name:k.name, saldo:s}); return; }
    if(Math.abs(s) >= 0.005) salden[k.nr] = r2((salden[k.nr]||0) + s);
  });
  return {salden:salden, unbekannt:unbekannt, mehrStellen:mehrStellen};
}
function pruefeSalden(salden, ix, extraGruppe){
  let aktiven=0, passiven=0, ergebnis=0, er=0;
  Object.keys(salden).forEach(nr=>{
    const g = E.grp(ix, nr) || (extraGruppe && extraGruppe[nr]);
    if(!g) return;
    if(g.s === "A") aktiven = r2(aktiven + salden[nr]);
    else if(g.s === "P") passiven = r2(passiven - salden[nr]);
    else { ergebnis = r2(ergebnis - salden[nr]); er++; }
  });
  return {aktiven:aktiven, passiven:passiven, ergebnis:ergebnis, mitErfolg:er>0,
          differenz: r2(aktiven - passiven - ergebnis)};
}

/* ---- An imported closing as a year of bookings (the Years page) ---- */
function synthAusSalden(basis, salden, vorjahr, jahr){
  const ix = E.ctx(basis);
  const ein = Object.assign({}, EINSTELLUNGEN, basis.einstellungen||{});
  const unbekannt = Object.keys(salden||{}).filter(nr=>!ix.km[nr]);
  const nur = o => { const r = {}; Object.keys(o||{}).forEach(nr=>{ if(ix.km[nr] && Math.abs(o[nr])>=0.005) r[nr] = r2(o[nr]); }); return r; };
  const s = nur(salden), v = vorjahr ? nur(vorjahr) : null;
  const gv = ix.km[ein.gewinnvortrag] ? ein.gewinnvortrag
           : (E.konten(basis).find(k=>{ const g = ix.gm[k.grp]; return g && g.sek === "EK"; })||{}).nr;
  const zeilen = o => Object.keys(o).filter(nr=>Math.abs(o[nr])>=0.005).map(nr=> o[nr] > 0 ? [nr, o[nr], 0] : [nr, 0, r2(-o[nr])]);
  const buchungen = [];
  // Bilanz ohne Erfolgskonten: Differenz ist das nicht ausgewiesene Ergebnis
  const hatER = Object.keys(s).some(nr=>E.istER(E.grp(ix,nr)));
  if(!hatER && gv){ let sum = 0; Object.keys(s).forEach(nr=> sum = r2(sum + s[nr])); if(Math.abs(sum) >= 0.005) s[gv] = r2((s[gv]||0) - sum); }
  let start = {};
  if(v){
    let erSum = 0;
    Object.keys(v).forEach(nr=>{ if(E.istER(E.grp(ix,nr))) erSum = r2(erSum + v[nr]); else start[nr] = v[nr]; });
    const hatVorER = Object.keys(v).some(nr=>E.istER(E.grp(ix,nr)));
    if(!hatVorER && gv){ let sum = 0; Object.keys(start).forEach(nr=> sum = r2(sum + start[nr])); if(Math.abs(sum)>=0.005) start[gv] = r2((start[gv]||0) - sum); }
    if(erSum && gv) start[gv] = r2((start[gv]||0) + erSum);
    buchungen.push({id:"s-eb", datum:jahr+"-01-01", eb:true, beleg:"", text:"Opening from prior-year balances", z:zeilen(start)});
  }
  const bew = {};
  Object.keys(s).forEach(nr=> bew[nr] = r2(s[nr] - (start[nr]||0)));
  Object.keys(start).forEach(nr=>{ if(!(nr in s)) bew[nr] = r2(-start[nr]); });
  if(v){
    // Abschreibungen sichtbar machen: gegen ein Konto der Investitionstätigkeit
    let d = 0; const ncZ = [];
    Object.keys(bew).forEach(nr=>{ const g = E.grp(ix,nr); if(E.istER(g) && g.nc && bew[nr] > 0){ d = r2(d + bew[nr]); ncZ.push([nr, bew[nr], 0]); } });
    const inv = Object.keys(Object.assign({}, start, s)).filter(nr=>{ const k = ix.km[nr]; return k && E.istBilanz(ix.gm[k.grp]) && E.cfKonto(ix,k) === "inv"; }).sort()[0];
    if(d > 0 && inv){
      buchungen.push({id:"s-abs", datum:jahr+"-12-31", beleg:"", text:"Depreciation", z:ncZ.concat([[inv, 0, d]])});
      ncZ.forEach(z=> bew[z[0]] = r2(bew[z[0]] - z[1]));
      bew[inv] = r2((bew[inv]||0) + d);
    }
  }
  buchungen.push({id:"s-bew", datum:jahr+"-12-31", beleg:"", text:"Year figures", z:zeilen(bew)});
  return {state:Object.assign({}, basis, {jahr:jahr, buchungen:buchungen, synthetisch:true}), gf:!!v, unbekannt:unbekannt};
}

/* ---- Vergleichsquellen ---------------------------------------------- */
// kontext: {state, ix, datei:{state,name}|null}
function importQuelle(kontext, j){
  const vj = (kontext.state.vergleichsjahre||[]);
  const a = vj.find(v=>v.jahr === j); if(!a) return null;
  const b = vj.find(v=>v.jahr === j-1);
  const sy = synthAusSalden(kontext.state, a.salden, b ? b.salden : null, j);
  return {art:"periode", state:sy.state, ix:E.ctx(sy.state), von:j+"-01-01", bis:j+"-12-31",
          gf:sy.gf, label:"Closing "+j, jahresende:true, unbekannt:sy.unbekannt,
          hinweis: sy.gf ? "" : "Cash flow "+j+" is only available once "+(j-1)+" is imported as well."};
}

/* ---- Fast entry: dates and amounts ---------------------------------- */
// "15" -> 15th of the base month, "15.3" -> base year, "15.3.26", "15.03.2026", "1503", "150326"
function datumAusEingabe(t, basis){
  t = String(t==null?"":t).trim();
  if(!t) return null;
  if(istDatum(t)) return t;
  const b = istDatum(basis) ? basis : null, jetzt = new Date();
  const by = b ? +b.slice(0,4) : jetzt.getFullYear(), bm = b ? +b.slice(5,7) : jetzt.getMonth()+1;
  let m, d, mo, y;
  if((m = /^(\d{1,2})\.?$/.exec(t)))                                   { d=+m[1]; mo=bm; y=by; }
  else if((m = /^(\d{1,2})[.\/-](\d{1,2})\.?$/.exec(t)))               { d=+m[1]; mo=+m[2]; y=by; }
  else if((m = /^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2}|\d{4})$/.exec(t))){ d=+m[1]; mo=+m[2]; y=+m[3]; if(y<100) y+=2000; }
  else if((m = /^(\d{2})(\d{2})(\d{2}|\d{4})?$/.exec(t)))              { d=+m[1]; mo=+m[2]; y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : by; }
  else return null;
  const iso = y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  return istDatum(iso) ? iso : null;
}
// Plain numbers in any Swiss/German/English format, or simple arithmetic like "70+30" or "1200/12"
function betragAusEingabe(t){
  if(typeof t === "number") return isFinite(t) ? t : NaN;
  const roh = String(t==null?"":t).trim();
  if(!roh) return NaN;
  const direkt = zahl(roh);
  if(isFinite(direkt)) return direkt;
  const norm = roh.replace(/[\u2212\u2013]/g,"-");
  const tokens = norm.match(/\d[\d'’\u00A0 .,]*|[+\-*\/()]/g);
  if(!tokens || tokens.join("").replace(/\s/g,"") !== norm.replace(/\s/g,"")) return NaN;
  let expr = "";
  for(const tk of tokens){
    if(/^\d/.test(tk)){ const n = zahl(tk); if(!isFinite(n)) return NaN; expr += "("+n+")"; }
    else expr += tk;
  }
  try{ const v = Function('"use strict";return ('+expr+')')(); return (typeof v === "number" && isFinite(v)) ? v : NaN; }
  catch(e){ return NaN; }
}

/* ---- Opening balance from a closing list ---------------------------- */
// Balance sheet accounts carry over; all equity accounts plus the result of the
// closed year roll into the equity-at-beginning account (2800).
function eroeffnungAusSalden(state, ix, salden){
  const ein = Object.assign({}, EINSTELLUNGEN, state.einstellungen||{});
  const gv = ix.km[ein.gewinnvortrag] ? ein.gewinnvortrag : null;
  const z = {}; let er = 0, ek = 0; const unbekannt = [];
  Object.keys(salden||{}).forEach(nr=>{
    const v = r2(salden[nr]); if(Math.abs(v) < .005) return;
    const g = E.grp(ix, nr);
    if(!g){ unbekannt.push(nr); return; }
    if(g.s === "E") er = r2(er + v);
    else if(g.sek === "EK") ek = r2(ek + v);
    else z[nr] = r2((z[nr]||0) + v);
  });
  if(gv){ const neu = r2(ek + er); if(Math.abs(neu) >= .005) z[gv] = r2((z[gv]||0) + neu); }
  let summe = 0; Object.keys(z).forEach(nr=> summe = r2(summe + z[nr]));
  const zeilen = Object.keys(z).filter(nr=>Math.abs(z[nr])>=.005).sort((a,b)=>parseFloat(a)-parseFloat(b))
    .map(nr=> z[nr] > 0 ? [nr, z[nr], 0] : [nr, 0, r2(-z[nr])]);
  return {zeilen:zeilen, ergebnis:r2(-er), eigenkapital:r2(-(ek+er)), gewinnvortrag:gv, unbekannt:unbekannt, differenz:summe};
}

/* ---- Twelve-month report -------------------------------------------- */
function monatsbericht(state, ix){
  const j = state.jahr, monate = [];
  for(let m=1; m<=12; m++) monate.push({m:m, von:j+"-"+String(m).padStart(2,"0")+"-01", bis:E.letzterTag(j,m), kurz:E.MONATE[m-1].slice(0,3)});
  const kl = E.klassierung(state, ix);
  const fb = monate.map(x=> E.flachBilanz(E.bilanz(state, ix, j+"-01-01", x.bis)));
  const fe = monate.map(x=> E.flachErfolg(E.erfolg(state, ix, x.von, x.bis, kl)));
  const zB = new Set(), zE = new Set();
  fb.forEach(m=> Object.keys(m).forEach(k=>{ if(k.indexOf("k:")===0 && Math.abs(m[k])>=.005) zB.add(k.slice(2)); }));
  fe.forEach(m=> Object.keys(m).forEach(k=>{ if(k.indexOf("k:")===0 && Math.abs(m[k])>=.005) zE.add(k.slice(2)); }));
  const bj = E.bilanz(state, ix, j+"-01-01", j+"-12-31", zB);
  const ej = E.erfolg(state, ix, j+"-01-01", j+"-12-31", kl, zE);
  const reihe = (maps, key) => maps.map(m=> m[key] === undefined ? 0 : m[key]);
  const bil = [];
  [bj.aktiven, bj.passiven].forEach((teil, ti)=>{
    bil.push({typ:"seite", text:teil.titel});
    teil.sektionen.forEach(s=>{
      if(!s.gruppen.length && !s.mitErgebnis) return;
      bil.push({typ:"bereich", text:s.titel});
      s.gruppen.forEach(g=>{
        if(g.konten.length > 1 || g.st === "immer") bil.push({typ:"gruppe", text:g.titel, werte:reihe(fb,"grp:"+g.code)});
        g.konten.forEach(k=> bil.push({typ:"konto", nr:k.nr, text:k.name, werte:reihe(fb,"k:"+k.nr), einzug:g.konten.length > 1 || g.st === "immer"}));
      });
      if(s.mitErgebnis) bil.push({typ:"konto", nr:"", text:(state.titel&&state.titel.ergebnis)||"Result for the period", werte:reihe(fb,"ergebnis")});
      bil.push({typ:"summe", text:"Total "+s.titel.toLowerCase(), werte:reihe(fb,"sek:"+s.code)});
    });
    bil.push({typ:"total", text:"Total "+teil.titel.toLowerCase(), werte:reihe(fb, ti===0 ? "aktiven" : "passiven")});
  });
  const erf = [];
  ej.zeilen.forEach(x=>{
    if(x.typ === "gruppe"){
      if(!x.konten.length) return;
      erf.push({typ:"gruppe", code:x.code, text:x.titel, werte:reihe(fe,"grp:"+x.code), total:x.wert});
      x.konten.forEach(k=> erf.push({typ:"konto", nr:k.nr, text:k.name, werte:reihe(fe,"k:"+k.nr), total:k.wert, einzug:true}));
    }else erf.push({typ: x.typ === "total" ? "total" : "summe", text:x.titel, werte:reihe(fe,x.code), total:x.wert});
  });
  return {jahr:j, monate:monate, bilanz:bil, erfolg:erf};
}

/* ---- Statement structure for the statement pages ------------------------
   One source of truth: the groups on the Structure page. The balance sheet
   lists the groups of every section with the section's total, total assets,
   total liabilities, equity with the result of the period, and the grand
   total. The income statement lists the groups in order, a block total where
   a group names one, a running subtotal where a group names one, and the
   result at the end. Node kinds as the statements engine reads them:
   sec = heading, g = group (drillable), s = subtotal, r = result line,
   t = grand total, sp = spacer. Ids the app relies on stay fixed: CA, NCA,
   TA, STL, LTL, TL, EQ, TLE, NP and FONDS (the cash groups); well-known
   subtotals keep their ids by title (TI, GR, EBITDA, EBIT, EBT).            */
const SEK_ID = {UV:"CA", AV:"NCA", KFK:"STL", LFK:"LTL", EK:"EQ"};
const ZW_ID = [[/^(total )?(income|revenue|ertrag|erträge|einnahmen)$/i, "TI"], [/^gross result$|^gross profit$|^bruttoergebnis$|^bruttogewinn$|^rohertrag$/i, "GR"],
  [/^gross result i$|^bruttoergebnis i$/i, "GR1"], [/^ebitda$/i, "EBITDA"], [/^ebit$/i, "EBIT"], [/\bebt\b|before tax|vor steuern/i, "EBT"],
  [/^total other operating expenses$|^total operating expenses$|^betriebsaufwand$/i, "TOE"]];
function abschlussStruktur(state){
  const sek = Object.assign({}, state.sektionen||{}), titel = state.titel||{};
  const gruppen = state.gruppen||[];
  const node = g => { const n = {k:"g", id:g.c, l:g.t, r:(g.r||[]).map(x=>x.slice())}; if(g.s === "P" && g.sek !== "EK") n.inv = 1; return n; };   // inv: a rising liability is coloured as a worsening
  const total = s => "Total "+String(s||"").toLowerCase();
  const BS = [{k:"sec", l:titel.aktiven || "Assets"}];
  const seite = (codes, mitErgebnis) => {
    const ids = [];
    codes.forEach(code=>{
      const gs = gruppen.filter(g=> E.istBilanz(g) && g.sek === code);
      if(!gs.length && !(mitErgebnis && code === "EK")) return;
      gs.forEach(g=> BS.push(node(g)));
      const of = gs.map(g=>g.c), id = SEK_ID[code] || ("SEK_"+code);
      if(mitErgebnis && code === "EK"){ BS.push({k:"g", id:"Q3", l:titel.ergebnis || "Result for the period", calc:"profit"}); of.push("Q3"); }
      const sub = {k:"s", id:id, l:total(sek[code]||code), of:of}; if(E.SEK_PASSIV.indexOf(code) >= 0 && code !== "EK") sub.inv = 1;
      BS.push(sub);
      ids.push(id);
      BS.push({k:"sp"});
    });
    return ids;
  };
  const aktiv = seite(E.SEK_AKTIV, false);
  BS.pop();                                                     // no spacer before the total
  BS.push({k:"t", id:"TA", l:total(titel.aktiven || "Assets"), of:aktiv}, {k:"sp"}, {k:"sec", l:titel.passiven || "Liabilities and equity"});
  const fk = seite(E.SEK_PASSIV.filter(c=> c !== "EK"), false);
  BS.pop();
  BS.push({k:"s", id:"TL", l:"Total liabilities", of:fk, inv:1}, {k:"sp"});
  seite(["EK"], true);
  BS.pop();
  BS.push({k:"t", id:"TLE", l:total(titel.passiven || "Liabilities and equity"), of:fk.length ? ["TL","EQ"] : ["EQ"]});

  const IS = [];
  let seitLauf = [], block = [], lauf = null;
  const zwId = (t, c) => { const w = ZW_ID.find(x=> x[0].test(String(t).trim())); return w && !IS.some(n=> n.id === w[1]) ? w[1] : "ZW_"+c; };
  gruppen.filter(E.istER).forEach(g=>{
    IS.push(node(g)); seitLauf.push(g.c); block.push(g.c);
    if(g.zwBlock){
      const id = zwId(g.zwBlock, "B"+g.c);
      IS.push({k:"s", id:id, l:g.zwBlock, of:block.slice()});
      seitLauf = seitLauf.filter(x=> block.indexOf(x) < 0).concat([id]);   // the block stands for its groups
      block = [];
    }
    if(g.zw){
      const id = zwId(g.zw, g.c), of = (lauf ? [lauf] : []).concat(seitLauf);
      IS.push({k: lauf ? "r" : "s", id:id, l:g.zw, of:of});
      IS.push({k:"sp"});
      lauf = id; seitLauf = []; block = [];
    }
  });
  IS.push({k:"t", id:"NP", l:titel.ergebnis || "Result for the period", of:(lauf ? [lauf] : []).concat(seitLauf), sign:1});
  const fonds = gruppen.filter(g=> E.istBilanz(g) && g.cf === "fonds").map(g=>g.c);
  return {BS:BS, IS:IS, FONDS:{k:"s", id:"FONDS", l:"Cash and cash equivalents", of:fonds}};
}
// Cash flow class of every account in the chart, from its own cash-flow setting or its group's: the buckets of the
// Structure page mapped onto the six classes the statements engine knows.
const BUCKET_KLASSE = {fonds:"cash", cash:"cash", inv:"invest", op_fll:"opAsset", op_vor:"opAsset", op_uea:"opAsset",
  op_vll:"opLiab", op_uep:"opLiab", rst:"opLiab", fin:"finLiab", ek:"equity"};
function cfKlassen(state, ix){
  const m = {};
  E.konten(state).forEach(k=>{
    const g = ix.gm[k.grp]; if(!g || !E.istBilanz(g)) return;
    const b = (k.cf && k.cf !== "nc") ? k.cf : g.cf;
    const kl = BUCKET_KLASSE[b];
    if(kl) m[k.nr] = kl;
    else if(g.sek === "EK") m[k.nr] = "equity";
    else m[k.nr] = g.s === "A" ? "opAsset" : "opLiab";
  });
  return m;
}
// investment candidates for the investments page: accounts of the investing class whose group holds financial
// assets, not property or equipment
const SACHANLAGEN = /movable|immovable|intangible|property|equipment|vehicle|sachanlage|mobilien|immobilien|fahrzeug|liegenschaft|immaterielle/i;
function anlageKandidaten(state, ix, klasse){
  return E.konten(state).filter(k=>{ const g = ix.gm[k.grp]; return g && g.s === "A" && klasse[k.nr] === "invest" && !SACHANLAGEN.test(g.t||""); }).map(k=>k.nr);
}

/* ---- Year-end check before closing ------------------------------------
   Nothing here blocks the close; these are the things a closing checklist
   looks at: clearing accounts at zero, in-year accrual accounts at zero,
   foreign-currency balances revalued, no balance on the wrong side, every
   spread of the year either released or carried over.                      */
function abschlussPruefung(state, ix, J){
  const w = [], bis = J+"-12-31", s = E.saldoPer(state, bis);
  const ein = Object.assign({}, EINSTELLUNGEN, state.einstellungen||{});
  const name = nr => (ix.km[nr] ? ix.km[nr].name : nr);
  const betrag = v => (v < 0 ? "\u2212" : "") + Math.abs(v).toFixed(2);
  const kontra = /\bwb\b|wertberichtigung|abschreibung|delkredere|kumuliert|allowance|accumulated|depreciation|auf-?\s*und\s*abwertung|aufwertung|abwertung|nicht realisiert|unrealised|value adjustment/i;
  const klaerung = /transfer|abkl[aä]rung|clearing|durchlauf|suspense|open items|clarification/i;
  E.konten(state).forEach(k=>{
    const g = ix.gm[k.grp]; if(!g || !E.istBilanz(g)) return;
    const v = r2(s[k.nr] || 0); if(Math.abs(v) < .005) return;
    if(klaerung.test(k.name) || klaerung.test(g.t))
      w.push("Clearing account "+k.nr+" "+k.name+" still carries "+betrag(v)+" at 31.12."+J+".");
    if(k.nr === ein.araJahr || k.nr === ein.praJahr)
      w.push("In-year accrual account "+k.nr+" should be zero at 31.12."+J+" but carries "+betrag(v)+".");
    if(g.s === "A" && v < 0 && !kontra.test(k.name))
      w.push("Asset account "+k.nr+" "+k.name+" has a credit balance ("+betrag(v)+"). A liability?");
    if(g.s === "P" && g.sek !== "EK" && v > 0)
      w.push("Liability account "+k.nr+" "+k.name+" has a debit balance ("+betrag(v)+"). A receivable?");
  });
  (E.neubewertung(state, ix, bis, state.kurse||{})||[]).forEach(z=>{
    if(Math.abs(z.differenz) >= .05) w.push("Foreign currency: "+z.nr+" "+z.name+" is booked at "+betrag(z.buchwert)+"; at the rate in the file ("+z.wkz+" "+z.kurs+") it is "+betrag(z.neuwert)+", difference "+betrag(z.differenz)+". Set the year-end rate and book the revaluation under Accounts, Foreign currencies.");
  });
  const jahr = Object.assign({}, state, {jahr:J});
  plaene(jahr, ix).forEach(p=>{
    if(!p.datum || p.datum.slice(0,4) !== String(J) || Math.abs(p.rest) < .005) return;

      const a = anlageNorm(roh), p = anlagePlan(state, a), monat = bis.slice(0,7);
      if(a.datum > bis || (a.abgang && a.abgang.datum <= bis)) return;
      let soll = a.vorher; p.zeilen.forEach(z=>{ if(z.quelle !== "vorher" && z.quelle !== "nach" && z.monat <= monat) soll = r2(soll + z.soll); if(z.monat === monat && z.quelle !== "vorher" && z.quelle !== "nach") aufwand = r2(aufwand + z.soll); });
      buchwert = r2(buchwert + a.kosten - soll);
    });
    reihe.push({m:m, kurz:E.MONATE[m-1].slice(0,3), name:E.MONATE[m-1], buchwert:buchwert, aufwand:aufwand});
  }
  return reihe;
}
/* per-year view of one schedule: opening value, charge, closing value */
function anlageJahre(state, a){
  const p = anlagePlan(state, a), jahre = {}, order = [];
  let lauf = r2(p.anlage.kosten - p.anlage.vorher);
  if(p.anlage.vorher > 0.005){ const j0 = p.anlage.ab.slice(0,4); jahre["vor"] = {jahr:"before "+p.anlage.ab, anfang:p.anlage.kosten, aufwand:p.anlage.vorher, ende:lauf}; order.push("vor"); }
  p.zeilen.forEach(z=>{
    if(z.quelle === "vorher" || z.quelle === "nach") return;
    const j = z.monat.slice(0,4);
    if(!jahre[j]){ jahre[j] = {jahr:j, anfang:lauf, aufwand:0, ende:lauf, offen:0, gebucht:0}; order.push(j); }
    const b = z.soll; jahre[j].aufwand = r2(jahre[j].aufwand + b); lauf = r2(lauf - b); jahre[j].ende = lauf;
    if(z.quelle === "offen") jahre[j].offen = r2(jahre[j].offen + b); else jahre[j].gebucht = r2(jahre[j].gebucht + b);
  });
  return order.map(k=> jahre[k]);
}
/* the accounts a new asset defaults to: the contra account next to the asset account, the
   depreciation account sharing a word with it, else the first account of the depreciation group */
function anlageVorschlag(state, ix, konto){
  const k = ix.km[konto]; if(!k) return {wb:"", aufwand:""};
  const alle = E.konten(state);
  const wb = alle.filter(x=> x.grp === k.grp && x.nr !== konto && istKontraName(x.name) && parseFloat(x.nr) > parseFloat(konto)).sort((x, y)=> parseFloat(x.nr) - parseFloat(y.nr))[0];
  const stop = /^(abschreibung(en)?|abschr|wb|wertberichtigung(en)?|auf|und|inkl|etc|bis|über|ueber|jahre?|analog|restwert|aktivierung|chf|der|die|das|des|von|mit|ohne|netto|brutto|and|the|of)$/;
  const worte = s => String(s||"").toLowerCase().split(/[^a-zäöüéèàç]+/).filter(t=> t.length >= 3 && !stop.test(t));
  const kw = worte(k.name);
  const er = alle.filter(x=> E.istER(ix.gm[x.grp]) && /abschreib|depreciation|amortis/i.test(x.name));
  let auf = er.find(x=> worte(x.name).some(t=> kw.some(u=> t === u || (t.length >= 4 && u.startsWith(t)) || (u.length >= 4 && t.startsWith(u)))));
  if(!auf) auf = er[0] || alle.find(x=>{ const g = ix.gm[x.grp]; return g && E.istER(g) && /depreciation|abschreib|amortis/i.test(g.t); });
  return {wb: wb ? wb.nr : "", aufwand: auf ? auf.nr : ""};
}
/* the groups that hold depreciable assets, and whether a booking line asks for the register */
function istAnlageGruppe(g){ return !!g && g.s === "A" && !!g.anlage; }
function anlageKonto(ix, nr){
  const k = ix.km[nr]; if(!k) return false;
  const g = ix.gm[k.grp]; if(!istAnlageGruppe(g)) return false;
  return !istKontraName(k.name);
}

/* ---- Sign convention by balance check ------------------------------- */
function besterModus(analyse, spalte, ix, zuordnung){
  const heuristik = erkenneVorzeichen(analyse, spalte, ix);
  const reihe = [heuristik, "darstellung", "soll", "betrag", "haben"].filter((v,i,a)=>a.indexOf(v)===i);
  for(const m of reihe){
    const r = saldenAusImport(analyse, spalte, m, ix, zuordnung);
    if(Object.keys(r.salden).length && Math.abs(pruefeSalden(r.salden, ix).differenz) < .05) return m;
  }
  return heuristik;
}


/* ---- Years side by side --------------------------------------------- */
// Imported closings plus the current year, one column each.
function jahresvergleich(kontext){
  const st = kontext.state, ix = kontext.ix;
  const imFile = new Set(Object.keys(E.jahreMitBuchungen(st)).map(Number).concat([st.jahr]));
  const q = [];
  (st.vergleichsjahre||[]).map(v=>v.jahr).filter(j=>!imFile.has(j)).concat(Array.from(imFile)).sort((a,b)=>a-b).forEach(j=>{
    if(imFile.has(j)) q.push({state:st, ix:ix, von:j+"-01-01", bis:j+"-12-31", jahr:j, label:String(j), aktuell:j===st.jahr});
    else q.push(Object.assign(importQuelle(kontext, j), {jahr:j, label:String(j), importiert:true}));
  });
  const fb = q.map(x=> E.flachBilanz(E.bilanz(x.state, x.ix, x.von, x.bis)));
  const fe = q.map(x=> E.flachErfolg(E.erfolg(x.state, x.ix, x.von, x.bis)));
  const r = strukturZeilen(st, ix, fb, fe, st.jahr+"-01-01", st.jahr+"-12-31");
  return {spalten:q.map(x=>({jahr:x.jahr, label:x.label, importiert:!!x.importiert})), bilanz:r.bilanz, erfolg:r.erfolg};
}
function strukturZeilen(state, ix, fb, fe, von, bis){
  const zB = new Set(), zE = new Set();
  fb.forEach(m=> Object.keys(m).forEach(k=>{ if(k.indexOf("k:")===0 && Math.abs(m[k])>=.005) zB.add(k.slice(2)); }));
  fe.forEach(m=> Object.keys(m).forEach(k=>{ if(k.indexOf("k:")===0 && Math.abs(m[k])>=.005) zE.add(k.slice(2)); }));
  const bj = E.bilanz(state, ix, von, bis, zB), ej = E.erfolg(state, ix, von, bis, null, zE);
  const reihe = (maps, key) => maps.map(m=> m[key] === undefined ? 0 : m[key]);
  const bil = [];
  [bj.aktiven, bj.passiven].forEach((teil, ti)=>{
    bil.push({typ:"seite", text:teil.titel});
    teil.sektionen.forEach(s=>{
      if(!s.gruppen.length && !s.mitErgebnis) return;
      bil.push({typ:"bereich", text:s.titel});
      s.gruppen.forEach(g=>{
        const mehr = g.konten.length > 1 || g.st === "immer";
        if(mehr) bil.push({typ:"gruppe", text:g.titel, werte:reihe(fb,"grp:"+g.code)});
        g.konten.forEach(k=> bil.push({typ:"konto", nr:k.nr, text:k.name, werte:reihe(fb,"k:"+k.nr), einzug:mehr}));
      });
      if(s.mitErgebnis) bil.push({typ:"konto", nr:"", text:(state.titel&&state.titel.ergebnis)||"Result for the period", werte:reihe(fb,"ergebnis")});
      bil.push({typ:"summe", text:"Total "+s.titel.toLowerCase(), werte:reihe(fb,"sek:"+s.code)});
    });
    bil.push({typ:"total", text:"Total "+teil.titel.toLowerCase(), werte:reihe(fb, ti===0 ? "aktiven" : "passiven")});
  });
  const erf = [];
  ej.zeilen.forEach(x=>{
    if(x.typ === "gruppe"){
      if(!x.konten.length) return;
      erf.push({typ:"gruppe", code:x.code, text:x.titel, werte:reihe(fe,"grp:"+x.code)});
      x.konten.forEach(k=> erf.push({typ:"konto", nr:k.nr, text:k.name, werte:reihe(fe,"k:"+k.nr), einzug:true}));
    }else erf.push({typ: x.typ === "total" ? "total" : "summe", text:x.titel, werte:reihe(fe,x.code)});
  });
  return {bilanz:bil, erfolg:erf};
}


/* ---- All twelve month ends of a year in one pass ---------------------
   Per account at each month end: balance sheet accounts their balance,
   income statement accounts the year to date; accounts below 2000 as
   they are, all others reversed (the statements engine's sign). The
   year's bookings are read once. */
function fsMonatsWerte(state, ix, J){
  const buch = E.imJahr(state, J).filter(b=> b && E.istDatum(b.datum)).slice().sort((a,b)=> a.datum < b.datum ? -1 : (a.datum > b.datum ? 1 : 0));
  const bs = {}, er = {}, aus = [];
  const konten = E.konten(state).filter(k=> ix.gm[k.grp]);
  let i = 0;
  for(let m = 1; m <= 12; m++){
    const bis = E.letzterTag(J, m);
    for(; i < buch.length && buch[i].datum <= bis; i++){
      const b = buch[i];
      b.z.forEach(z=>{
        const d = (z[1]||0) - (z[2]||0);
        bs[z[0]] = r2((bs[z[0]]||0) + d);
        if(!b.eb) er[z[0]] = r2((er[z[0]]||0) + d);
      });
    }
    const w = {};
    konten.forEach(k=>{
      const saldo = ix.gm[k.grp].s === "E" ? (er[k.nr]||0) : (bs[k.nr]||0);
      if(Math.abs(saldo) < .005) return;
      w[k.nr] = parseFloat(k.nr) < 2000 ? r2(saldo) : r2(-saldo);
    });
    aus.push(w);
  }
  return aus;
}
