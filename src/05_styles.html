<!-- EVEN · tool styles: what EVEN needs beyond the Design Lab components, tokens only (interface rebuilt on the kit, 25.10.2026) -->
<style id="tool">
/* EVEN · tool styles of the interface rebuild (preview). Tokens only, no hex colours; everything else is a kit component.
   EVEN's own pieces: the side navigation (16 pages, the computer is the main device), the page head with the period
   controls, the balance picture, the month chart, the journal rows. */

/* ---------------------------------------------------------------- shell: side navigation + main */
.ev{position:relative;z-index:1;display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.ev-side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px;padding:18px 14px 14px;
  background:var(--header-bg);border-right:var(--bw) solid var(--header-border);-webkit-backdrop-filter:var(--header-blur);backdrop-filter:var(--header-blur)}
.ev-brand{display:flex;align-items:center;gap:12px;padding:2px 6px 6px}
.ev-brand .app-icon{width:38px;height:38px;border-radius:var(--r-icon);flex:none;box-shadow:var(--shadow-icon);overflow:hidden}
.ev-brand__text b{display:block;font-family:var(--font-display);font-weight:var(--fw-display);font-size:var(--fs-apptitle);letter-spacing:var(--ls-display);line-height:1.1}
.ev-brand__text small{display:block;color:var(--text-3);font-size:12px;margin-top:2px}
.ev-nav{flex:1;overflow-x:hidden;overflow-y:auto;display:grid;align-content:start;gap:2px;padding:0 2px;margin:0 -2px}
.ev-nav__group{font-size:var(--label-size);font-weight:var(--label-weight);letter-spacing:var(--label-spacing);text-transform:var(--label-case);color:var(--text-3);padding:14px 10px 6px}
.ev-nav__item{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border-radius:var(--r-control);color:var(--text-2);font-size:14px;font-weight:500;text-align:left;
  transition:background var(--dur-fast),color var(--dur-fast)}
.ev-nav__item svg{flex:none;opacity:.85}
.ev-nav__item span:not(.soon){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-nav__item:hover{background:var(--row-hover);color:var(--text)}
.ev-nav__item.is-active{background:var(--tab-active-bg);color:var(--tab-active-text);box-shadow:var(--tab-active-shadow);font-weight:var(--fw-tab)}
.ev-nav__item.is-active svg{opacity:1}
.ev-nav__item .soon{flex:none;font-size:10.5px;color:var(--text-4);font-weight:600;white-space:nowrap}
.ev-side__foot{display:grid;gap:10px;padding-top:12px;border-top:var(--bw) solid var(--hairline)}
.ev-file{color:var(--text-3);font-size:12px;padding:0 4px;overflow-wrap:anywhere}
.ev-side__actions{display:flex;align-items:center;gap:6px}
.ev-side__actions .save{flex:1}
.ev-main{min-width:0;padding:22px clamp(16px,3vw,40px) 64px;max-width:1280px;width:100%}
.ev-scrim{display:none}

/* ---------------------------------------------------------------- page head: eyebrow + title, period controls on the right */
.ev-head{display:flex;align-items:flex-end;gap:14px 18px;flex-wrap:wrap;margin-bottom:var(--head-gap)}
.ev-head__title{flex:1;min-width:200px}
.ev-head__title .section__title{margin:2px 0 0}
.ev-head__ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ev-menu{display:none}
.ev-page[hidden]{display:none}

/* ---------------------------------------------------------------- Overview */
.ev-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
.delta--flat{background:var(--neutral-soft);color:var(--text-2)}
.ev-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap);margin-top:var(--gap)}
/* the balance picture: assets against liabilities and equity, one bar each, sections in proportion */
.ev-bal{display:grid;gap:8px;margin:2px 0 16px}
.ev-bal__row{display:grid;grid-template-columns:118px minmax(0,1fr) auto;align-items:center;gap:12px;font-size:12.5px;color:var(--text-2)}
.ev-bal__bar{display:flex;height:14px;border-radius:var(--r-chip);overflow:hidden;background:var(--neutral-soft)}
.ev-bal__bar i{display:block;height:100%;transform-origin:0 50%;animation:evGrow var(--dur-chart) var(--ease) both}
.ev-bal__sum{font-family:var(--font-num-table);font-variant-numeric:tabular-nums;font-weight:600;color:var(--text)}
@keyframes evGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ev-bs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 22px}
.ev-bs h3{margin:0 0 6px;font-size:var(--label-size);font-weight:var(--label-weight);letter-spacing:var(--label-spacing);text-transform:var(--label-case);color:var(--text-3)}
.ev-bs__row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:var(--bw) solid var(--hairline);font-size:13.5px}
.ev-bs__row span:first-child{display:flex;align-items:center;gap:8px;min-width:0;color:var(--text-2)}
.ev-bs__row i{width:8px;height:8px;border-radius:2px;flex:none}
.ev-bs__row b,.ev-bs__row span:last-child{font-family:var(--font-num-table);font-variant-numeric:tabular-nums;white-space:nowrap}
.ev-bs__row.sum{border-bottom:0;font-weight:var(--fw-strong)}
.ev-bs__row.sum span:first-child{color:var(--text)}
.neg{color:var(--danger)}
/* month chart: income and expenses as bars, the result as a dashed line */
.ev-mm .bar.inc{fill:var(--ev-inc)} .ev-mm .bar.exp{fill:var(--ev-exp)}
.ev-mm .res{stroke:var(--ev-res)}
.ev-mm .ev-mm-dot{fill:var(--ev-res)}
/* the chart tip: a title, then label and value per line */
.ev-tip{min-width:150px}
.ev-tip__row{display:flex;justify-content:space-between;gap:16px}
.ev-tip__row b{font-family:var(--font-num-table);font-variant-numeric:tabular-nums;font-weight:600}
.chart .ev-hover-dot{fill:var(--surface-solid);stroke:var(--text);stroke-width:2;pointer-events:none}
.chart .cross{pointer-events:none}
.ev-mm .zero{stroke:var(--chart-axis);stroke-opacity:.5}

/* ---------------------------------------------------------------- Journal */
.ev-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:var(--gap)}
.ev-search{flex:1;min-width:240px;margin:0}
.ev-jo .table td{vertical-align:top}
.ev-jo .table td.d{white-space:nowrap;color:var(--text-2)}
.ev-jo .table td.k{color:var(--text-2);font-size:13px}
.ev-jo .table td.k small{display:block;color:var(--text-3);font-size:12px}
.ev-jo .table .z td{padding-top:0;border-top:0;color:var(--text-3);font-size:12.5px}
.ev-hit{background:var(--accent-soft);color:var(--accent-text);border-radius:3px;padding:0 2px}
.ev-jo .table td.a,.ev-jo .table th.a{width:76px;text-align:right;padding-top:6px;padding-bottom:6px}
.ev-jo .table td.a .btn{height:26px;opacity:0;transition:opacity var(--dur-fast)}
.ev-jo .table tr:hover td.a .btn,.ev-jo .table td.a .btn:focus-visible{opacity:1}
@media (hover:none){ .ev-jo .table td.a .btn{opacity:1} }
.ev-jo .table tr.is-current td{background:var(--accent-soft)}
.ev-jo .table tr.is-new td,.ev-recent.is-new{animation:evNew 1.8s var(--ease)}
@keyframes evNew{from{background:var(--accent-soft)}}

/* ---------------------------------------------------------------- shared small pieces */
.ev-chip-sm{height:20px;padding:0 7px;margin-left:6px;font-size:11px;vertical-align:1px}
.ev-chip-sm.is-ok{background:var(--ev-ok-soft);color:var(--ev-ok)}
.ev-chip-sm.is-warn{background:var(--ev-warn-soft);color:var(--ev-warn)}
.ev-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ev-klick{cursor:pointer}
.ev-fx{color:var(--text-3);font-size:12px}
.field__hint.neg{color:var(--danger)}
.modal__actions.ev-stack{flex-direction:column;align-items:stretch}
.modal:has(.ev-modal-table){max-width:640px}
.modal__text .ev-scroll{margin-top:14px;border-radius:var(--r-inner);border:var(--bw) solid var(--table-border)}
.ev-modal-table{font-size:13px}
.ev-modal-table td{padding:8px 12px}
.ev-modal-table tr.sum td{border-bottom:0}

/* ---------------------------------------------------------------- Book: the card on the left, the panels beside it */
.ev-book{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:var(--gap);align-items:start}
.ev-book__main,.ev-book__side{display:grid;gap:var(--gap);min-width:0}
.ev-mask{position:relative;overflow:visible}
.ev-mask.is-booked{animation:evBooked 1s var(--ease)}
@keyframes evBooked{30%{box-shadow:0 0 0 4px var(--ev-ok-soft)}}
/* the seal of the stamp effect (07_effects turns its ring) */
.siegel{position:absolute;left:50%;top:44%;width:190px;height:190px;margin:-95px 0 0 -95px;pointer-events:none;opacity:0;z-index:30}
.siegel.los{animation:evSeal 1.25s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes evSeal{0%{opacity:0;transform:scale(1.5) rotate(-18deg)}30%{opacity:1;transform:scale(1) rotate(0)}70%{opacity:1;transform:scale(1) rotate(0)}100%{opacity:0;transform:scale(.96) rotate(2deg)}}
.ev-banner{margin:0 0 16px;padding:10px 13px;border-radius:var(--r-control);background:var(--accent-soft);color:var(--text);font-size:13px;line-height:1.5}
/* quick entry: date, text, amount; then debit → credit */
.ev-quick{display:grid;grid-template-columns:150px minmax(0,1fr) 170px;grid-template-areas:"datum text betrag" "konten konten konten";gap:12px 14px}
.ev-quick__datum{grid-area:datum} .ev-quick__text{grid-area:text} .ev-quick__betrag{grid-area:betrag}
/* Lines: date and text stay, amount and accounts are the lines' own */
.ev-mask.is-lines .ev-quick{grid-template-areas:"datum text text";margin-bottom:6px}
.ev-mask.is-lines .ev-quick__betrag,.ev-mask.is-lines .ev-quick__konten{display:none}
.ev-quick__konten{grid-area:konten;display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr);gap:0 10px;align-items:start}
.ev-quick__to{padding-top:38px;text-align:center;color:var(--text-3);font-size:16px}
.ev-quick .field__hint,.ev-split .field__hint,.ev-lines .field__hint{min-height:16px}
.ev-links{display:flex;gap:10px}
.ev-link{font-size:11.5px;font-weight:600;color:var(--accent);text-transform:none;letter-spacing:0}
.ev-link:hover{text-decoration:underline}
.ev-kinfo{display:flex;justify-content:space-between;gap:10px}
.ev-kinfo span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-kinfo b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text-2)}
.ev-kinfo b.neg{color:var(--danger)}
.ev-fxrow{display:grid;grid-template-columns:180px 130px minmax(0,1fr);gap:14px;align-items:end;margin-top:12px}
.ev-fxrow .note{margin:0 0 12px}
/* the split side and the lines: a quiet panel, smaller fields */
.ev-split{display:grid;gap:8px;margin-top:14px;padding:14px;border-radius:var(--r-inner);background:var(--ev-panel);border:var(--bw) solid var(--ev-rule)}
.ev-split__head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px;margin-bottom:2px}
.ev-rest.is-zero{background:var(--ev-ok-soft);color:var(--ev-ok)}
.ev-rest.is-open{background:var(--ev-warn-soft);color:var(--ev-warn)}
.ev-rest.is-over{background:var(--danger-soft);color:var(--danger)}
.ev-split__row{display:grid;grid-template-columns:minmax(0,1.4fr) 130px minmax(0,1fr) 36px;gap:8px;align-items:start}
.ev-split__row.has-fx{grid-template-columns:minmax(0,1.3fr) 100px 80px 120px minmax(0,1fr) 36px}
.ev-split .input,.ev-lines .input{height:40px;font-size:14px}
.ev-split .btn--icon,.ev-lines .btn--icon{margin-top:4px}
.ev-lines{display:grid;gap:8px}
.ev-lines__head,.ev-lines__row{display:grid;grid-template-columns:minmax(0,1.5fr) 120px 120px minmax(0,1fr) 36px;gap:8px;align-items:start}
.ev-lines__head{font-size:var(--label-size);font-weight:var(--label-weight);letter-spacing:var(--label-spacing);text-transform:var(--label-case);color:var(--text-3)}
.ev-lines__head .r{text-align:right}
.ev-lines__fx{display:flex;gap:6px;margin-top:4px}
.ev-lines__fx .input{height:34px}
.ev-lines > .btn{justify-self:start}
/* the posting as it will be booked, with the balance beam */
.ev-post{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;align-items:center;margin-top:18px;padding:14px 16px;border-radius:var(--r-inner);background:var(--ev-panel);border:var(--bw) solid var(--ev-rule)}
.ev-post__sides{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:4px 14px;align-items:start;min-width:0}
.ev-post__side{min-width:0}
.ev-post__title{font-size:var(--label-size);font-weight:var(--label-weight);letter-spacing:var(--label-spacing);text-transform:var(--label-case);color:var(--text-3);margin-bottom:4px}
.ev-post__line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 0;font-size:13.5px;line-height:1.35}
.ev-post__line > span:first-child{min-width:0;overflow-wrap:anywhere}
.ev-post__line small{color:var(--text-3)}
.ev-post__line .n{font-family:var(--font-num-table);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.ev-post__to{align-self:center;color:var(--text-3);font-style:italic;font-size:13px}
.ev-post__none{color:var(--text-4)}
.ev-post__empty{grid-column:1/-1;margin:0;color:var(--text-3);font-size:13px}
.ev-beam{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;color:var(--text-3);transition:color var(--dur) var(--ease)}
.ev-beam.is-even{color:var(--ev-ok)} .ev-beam.is-off{color:var(--ev-warn)}
.ev-beam svg{flex:none}
.ev-beam__arm{transform-box:view-box;transform-origin:66px 20px;transition:transform .5s var(--ease-spring)}
.ev-beam__vals{display:grid;grid-template-columns:auto auto;gap:2px 12px;font-size:12.5px;color:var(--text-3)}
.ev-beam__vals b{font-family:var(--font-num-table);font-variant-numeric:tabular-nums;text-align:right;color:var(--text);font-weight:600}
.ev-beam__verdict{min-width:92px;font-weight:600;font-size:13px}
/* the beam sits beside the posting where the card is wide, below it where it is narrow (a container query on the card) */
.ev-mask{container-type:inline-size}
@container (max-width:700px){ .ev-post{grid-template-columns:minmax(0,1fr)} .ev-beam{padding-top:10px;border-top:var(--bw) solid var(--ev-rule)} }
/* the spread */
.ev-vt{margin-top:16px;padding-top:10px;border-top:var(--bw) solid var(--hairline)}
.ev-vt__panel{display:grid;gap:12px;margin-top:8px}
.ev-vt__fields{display:grid;grid-template-columns:170px 110px minmax(0,1fr);gap:14px;align-items:end}
.ev-vt__fields .note{margin:0 0 4px}
.ev-vt__table{max-height:290px;overflow:auto;border-radius:var(--r-inner);border:var(--bw) solid var(--table-border)}
.ev-vt__table .table td{padding:7px 12px}
#vt-vorschau .note{margin:8px 0 0}
/* the checks: problems one by one, or one calm line */
.ev-checks{display:grid;gap:6px;margin-top:16px}
.ev-check{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.45;color:var(--text-2)}
.ev-check__i{width:18px;height:18px;flex:none;margin-top:1px;border-radius:50%;display:grid;place-items:center}
.ev-check.is-fehler .ev-check__i{background:var(--danger-soft);color:var(--danger)}
.ev-check.is-warn .ev-check__i{background:var(--ev-warn-soft);color:var(--ev-warn)}
.ev-check.is-ok .ev-check__i{background:var(--ev-ok-soft);color:var(--ev-ok)}
.ev-check.is-ok{color:var(--text)}
.ev-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.ev-actions .spacer{flex:1}
.btn kbd{font:inherit;font-size:11px;line-height:1;padding:3px 6px;border-radius:5px;background:color-mix(in srgb,currentColor 16%,transparent)}
#bu-ok.is-new{animation:evReady .6s var(--ease-spring)}
@keyframes evReady{40%{transform:scale(1.045)}}
/* the side: balance of the account in focus, recent bookings, spreads */
.ev-bal-now{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:2px 0 12px;margin-bottom:6px;border-bottom:var(--bw) solid var(--hairline)}
.ev-bal-now span{font-size:13px;color:var(--text-2)}
.ev-bal-now small{display:block;font-size:12px;color:var(--text-3)}
.ev-bal-now b{font-family:var(--font-display);font-weight:var(--fw-display);font-size:24px;letter-spacing:var(--ls-display);font-variant-numeric:tabular-nums;white-space:nowrap}
#bu-verlauf-saldo .note{margin:-4px 0 8px;text-align:right}
.ev-recents{display:grid;margin:0 -6px}
.ev-recent{display:grid;grid-template-columns:46px minmax(0,1fr) auto;grid-template-areas:"d t n" "d k a";gap:1px 10px;align-items:center;padding:8px 6px;border-radius:var(--r-control);cursor:pointer}
.ev-recent:hover,.ev-recent:focus-visible{background:var(--row-hover);outline:none}
.ev-recent .d{grid-area:d;align-self:start;padding-top:2px;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.ev-recent .t{grid-area:t;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.ev-recent .n{grid-area:n;font-family:var(--font-num-table);font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px;white-space:nowrap}
.ev-recent .k{grid-area:k;font-size:12px;color:var(--text-3)}
.ev-recent .btn{grid-area:a;justify-self:end;height:24px;padding:0 8px;opacity:0;transition:opacity var(--dur-fast)}
.ev-recent:hover .btn,.ev-recent .btn:focus-visible{opacity:1}
@media (hover:none){ .ev-recent .btn{opacity:1} }
.ev-plans{display:grid;margin:0 -6px}
.ev-offer{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 6px 8px;padding:10px 12px;border-radius:var(--r-control);background:var(--ev-warn-soft);font-size:13px;line-height:1.45}
.ev-plan{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 6px;border-radius:var(--r-control);cursor:pointer}
.ev-plan:hover,.ev-plan:focus-visible{background:var(--row-hover);outline:none}
.ev-plan + .ev-plan{border-top:var(--bw) solid var(--hairline)}
.ev-plan .t{font-size:13.5px;min-width:0}
.ev-plan .n{font-family:var(--font-num-table);font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px}
.ev-plan .progress{grid-column:1/-1;height:4px}
.ev-plan .m{grid-column:1/-1;font-size:12px;color:var(--text-3)}
.ev-plans > .note{margin:0 6px}
.ev-latest .table{min-width:620px}

/* the pickers: accounts (number, name, balance, group) and earlier texts */
.ev-pick .menu__item{min-height:0;white-space:normal}
.ev-pick .menu__item.is-active{background:var(--accent-soft)}
.ev-pick--konto .menu__item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;grid-template-areas:"nr nm v" "nr g g";gap:0 10px;align-items:baseline;padding:6px 10px}
.ev-pick--konto .nr{grid-area:nr;font-weight:700;font-variant-numeric:tabular-nums}
.ev-pick--konto .nm{grid-area:nm;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-pick--konto .v{grid-area:v;font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.ev-pick--konto .g{grid-area:g;font-size:11.5px;color:var(--text-3)}
.ev-pick--text .menu__item{display:grid;gap:1px;justify-content:stretch;padding:7px 10px}
.ev-pick--text mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.ev-pick--text .kz{font-size:11.5px;color:var(--text-3)}
.ev-pick__leer{padding:10px;font-size:13px;color:var(--text-3)}

/* ---------------------------------------------------------------- Ledger */
.ev-hb-top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:14px 24px}
.ev-hb-konto{flex:1 1 320px;max-width:520px}
.ev-hb-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:24px}
/* the export: what it covers (the window of the page head), then the two formats */
.ev-export{display:flex;align-items:center;gap:6px;padding:3px 3px 3px 12px;border-radius:var(--r-seg);border:var(--bw) solid var(--border);background:var(--field-bg)}
.ev-export__what{display:grid;line-height:1.15;margin-right:6px}
.ev-export__what small{font-size:10.5px;font-weight:var(--label-weight);letter-spacing:var(--label-spacing);text-transform:var(--label-case);color:var(--text-3)}
.ev-export__what b{font-size:13px;font-weight:600;white-space:nowrap}
.ev-export .btn{height:30px}
.ev-tools .ev-export{margin-left:auto}
/* the filter (Ctrl+F): the dialog's fields two by two, and the bar over the Journal while it is set */
.ev-filter-dlg .modal{max-width:560px}
.ev-filter{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ev-filter .field{margin:0}
.ev-filter__keys{margin:14px 0 0}
.ev-filterbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 12px;margin-bottom:var(--gap);border-radius:var(--r-control);background:var(--accent-soft)}
.ev-filterbar .chip b{font-weight:700;color:var(--text)}
.ev-filterbar__n{margin-left:auto;color:var(--text-2);font-size:13px;font-variant-numeric:tabular-nums}
.ev-jo-filter{padding:0;overflow:hidden}
@media (max-width:599px){ .ev-filter{grid-template-columns:minmax(0,1fr)} .ev-filterbar__n{margin-left:0;width:100%} }
.ev-hb-tools{margin-top:var(--gap)}
.ev-hb-tools__t{flex:1;font-size:13px;color:var(--text-3)}
/* opening and closing balance around the months */
.ev-edge{display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:var(--r-card);background:var(--ev-panel);border:var(--bw) solid var(--ev-rule)}
.ev-edge > span:first-child{flex:1;min-width:0}
.ev-edge b{display:block;font-size:14px;font-weight:600}
.ev-edge small{font-size:12px;color:var(--text-3)}
.ev-edge__fx{font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.ev-edge__v{font-family:var(--font-num-table);font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.group__sum.neg{color:var(--danger)}
.ev-figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:18px 0 6px}
.ev-fig{padding:12px 14px;border-radius:var(--r-inner);background:var(--ev-panel);border:var(--bw) solid var(--ev-rule)}
.ev-fig__v{margin:4px 0 2px;font-family:var(--font-display);font-weight:var(--fw-display);font-size:22px;letter-spacing:var(--ls-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.ev-fig small{font-size:12px;color:var(--text-3)}
.ev-hb-line{height:130px;margin-top:12px}
.ev-hb-line .series{stroke:var(--ev-pay)}
.ev-hb-line .area{fill:var(--ev-pay);opacity:.12}
.ev-hb-line .zero{stroke:var(--chart-axis);stroke-opacity:.5}
.ev-ledger .table td.bal{font-weight:700}

/* ---------------------------------------------------------------- Statements: one sheet, groups open to their accounts */
.ev-st-bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 14px;margin-bottom:var(--gap)}
.ev-st-bar .field{gap:5px}
.ev-st-bar .select--pill{min-width:150px}
.ev-st-bar__opts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-bottom:6px}
.ev-st-bar__opts .check{font-size:13px}
.ev-st-bar .ev-export{margin-left:auto}
.ev-st-figs{margin:0 0 var(--gap)}
.ev-st-figs .ev-fig small{display:flex;align-items:center;gap:6px;min-height:22px}
.ev-st-card{padding:0;overflow:hidden}
.ev-st-card + .ev-st-card{margin-top:var(--gap)}
.ev-st-card__head{padding:var(--pad-card) var(--pad-card) 6px;margin:0}
.ev-st{font-size:13.5px}
.ev-st td,.ev-st th{white-space:nowrap}
.ev-st th.lbl,.ev-st td.lbl{width:100%;min-width:220px;white-space:normal}
.ev-st th.per .ev-st__per{display:grid;justify-items:end;line-height:1.25}
.ev-st th.per b{font-weight:700;color:var(--text);text-transform:none;letter-spacing:0}
.ev-st th.per small{font-size:11px;font-weight:500;color:var(--text-3);text-transform:none;letter-spacing:0}
.ev-st td.num{min-width:110px}
.ev-st td.num.is-nil{color:var(--text-4)}
.ev-st td.chg{color:var(--text-2);font-weight:500;font-family:var(--font-num-table)}
.ev-st td.pct{color:var(--text-3);font-size:12.5px;min-width:64px}
.ev-st tbody tr.is-part:hover,.ev-st tbody tr.is-section:hover,.ev-st tbody tr.is-gap:hover{background:none}
.ev-st tr.is-part td{padding:20px 14px 8px;border-bottom:0;font-family:var(--font-display);font-weight:var(--fw-display);font-size:17px;letter-spacing:var(--ls-display)}
.ev-st tr.is-section td{padding:16px 14px 6px;font-size:var(--label-size);font-weight:var(--label-weight);letter-spacing:var(--label-spacing);text-transform:var(--label-case);color:var(--accent)}
.ev-st tr.is-gap td{padding:5px;border:0}
.ev-st tr.has-kids{cursor:pointer}
.ev-st tr.has-kids:focus-visible{outline:none;box-shadow:inset 0 0 0 1.5px var(--focus)}
.ev-st .chev{display:inline-block;width:7px;height:7px;margin:0 10px 2px 2px;border-right:1.6px solid var(--text-3);border-bottom:1.6px solid var(--text-3);transform:rotate(-45deg);transition:transform var(--dur) var(--ease-spring)}
.ev-st tr.is-open .chev{transform:rotate(45deg)}
.ev-st__n{display:inline-block;margin-left:8px;padding:0 7px;border-radius:999px;background:var(--neutral-soft);font-size:11px;font-weight:600;color:var(--text-3);vertical-align:1px}
.ev-st tr.is-group:not(.has-kids) td.lbl{padding-left:33px}
/* accounts appear at once: on a statement a moving row is a distraction (owner, 25.10.) */
.ev-st tr.is-leaf td{padding-top:7px;padding-bottom:7px;font-size:13px;color:var(--text-2)}
.ev-st tr.is-leaf td.lbl{padding-left:52px}
.ev-st .nr{margin-right:8px;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.ev-st tr.is-sub td{font-weight:600;border-top:var(--bw) solid var(--border-strong)}
.ev-st tr.is-res td{font-weight:700;border-top:var(--bw) solid var(--border-strong);background:var(--ev-band)}
.ev-st tr.is-tot td{font-weight:700;font-size:14.5px;border-top:var(--bw) solid var(--text-2);border-bottom:3px double var(--text-2)}
.ev-st__checks{display:grid;gap:6px;padding:14px 18px;border-top:var(--bw) solid var(--hairline)}
.ev-st__checks:empty{display:none}
.ev-st__foot{padding:12px 18px}
.ev-check.is-info .ev-check__i{background:var(--accent-soft);color:var(--accent)}
.ev-st-notes{margin-top:var(--gap)}
.ev-st-notes .group__body .ev-st td.lbl{min-width:0}
/* the wide sheets (Twelve months, Years): one even colour under every cell, the first column stays while it scrolls */
.ev-wide{border-top:var(--bw) solid var(--hairline)}
.ev-st--wide{background:var(--ev-sheet)}
.ev-st--wide th,.ev-st--wide td{background:var(--ev-sheet)}
.ev-st--wide thead th{background:var(--ev-sheet-head)}
.ev-st--wide th.lbl,.ev-st--wide td.lbl{position:sticky;left:0;z-index:1;width:auto;min-width:230px;max-width:280px;box-shadow:1px 0 0 var(--hairline)}
.ev-st--wide thead th.lbl{z-index:3}
.ev-st--wide td.lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-st--wide td.num{min-width:92px;font-size:13px}
.ev-st--wide .is-year{font-weight:700;box-shadow:inset 1px 0 0 var(--hairline)}
.ev-st--wide tbody tr:hover td{background:color-mix(in srgb,var(--ev-sheet) 88%,var(--text) 6%)}
.ev-st--wide tr.is-part:hover td,.ev-st--wide tr.is-section:hover td{background:var(--ev-sheet)}
/* Twelve months on a computer: all twelve months and the year in view, whole francs (the exact amount on hover) */
@media (min-width:900px){
  .ev-st--fit{width:100%;table-layout:fixed}
  .ev-st--fit th.lbl,.ev-st--fit td.lbl{width:180px;min-width:0;max-width:none}
  .ev-st--fit th.is-year{width:82px}
  .ev-st--fit th.num,.ev-st--fit td.num{min-width:0;padding-left:4px;padding-right:9px;font-size:12.5px}
  .ev-st--fit tr.is-leaf td.lbl{padding-left:40px}
}

/* ---------------------------------------------------------------- Overview (Years), Investments, Fixed assets */
.ev-pair--top{margin-top:0}
.ev-gap-top{margin-top:var(--gap)}
.ev-chart{height:260px}
.ev-chart--short{height:200px}
.ev-chart .bar.inc{fill:var(--ev-inc)} .ev-chart .bar.exp{fill:var(--ev-exp)}
.ev-chart .ev-bar-plan{opacity:.38}
.ev-chart .res{stroke:var(--ev-res)}
.ev-chart .zero{stroke:var(--chart-axis);stroke-opacity:.5}
.ev-chart .ev-dot{fill:var(--ev-res);stroke:var(--surface-solid);stroke-width:1.5}
.ev-chart .ev-dot--worth{fill:var(--ev-worth)} .ev-chart .ev-dot--val{fill:var(--ev-val)}
.ev-chart .ev-area{fill:var(--ev-worth);opacity:.14}
.ev-chart .ev-worth-line{stroke:var(--ev-worth)}
.ev-chart .ev-assets-line{stroke:var(--ev-assets)}
.ev-chart .ev-pay-area{fill:var(--ev-pay);opacity:.2} .ev-chart .ev-pay-area.is-fc{opacity:.1}
.ev-chart .ev-pay-line{stroke:var(--ev-pay);stroke-width:1.6}
.ev-chart .ev-val-line{stroke:var(--ev-val)}
.ev-chart .ev-today{stroke:var(--text-3);stroke-dasharray:3 4;stroke-width:1}
.ev-hatch-key{background:repeating-linear-gradient(45deg,var(--ev-split-text) 0 3px,transparent 3px 6px)!important}
/* the donut with its list beside it */
.ev-donut{grid-template-columns:184px minmax(0,1fr);align-items:center;justify-items:stretch;gap:24px}
.ev-donut .donut__ring{width:184px}
/* the ring turns once in two minutes; it stops while the pointer is on it, so a segment is easy to point at */
.ev-donut .ev-spin{transform-box:view-box;transform-origin:50% 50%;animation:evSpin 120s linear infinite}
.ev-donut .donut__ring:hover .ev-spin,.ev-donut .donut__ring.is-hover .ev-spin{animation-play-state:paused}
@keyframes evSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .ev-donut .ev-spin{animation:none} }
.ev-donut-card .donut__list,.ev-sa-head .donut__list{max-width:440px}
/* the forecast horizon */
.ev-horizon{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px 16px;margin-top:16px;padding-top:14px;border-top:var(--bw) solid var(--hairline)}
.ev-horizon__v{display:grid;text-align:right;line-height:1.25}
.ev-horizon__v b{font-family:var(--font-num);font-size:18px;font-weight:var(--fw-num)}
.ev-horizon__v small{font-size:12px;color:var(--text-3)}
.ev-range{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;cursor:pointer;
  background:linear-gradient(90deg,var(--accent) 0 var(--fill,33%),var(--progress-track) var(--fill,33%) 100%)}
.ev-range::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--switch-knob);box-shadow:var(--switch-knob-shadow);border:0}
.ev-range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--switch-knob);box-shadow:var(--switch-knob-shadow);border:0}
.ev-range:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus-ring)}
/* the assumptions table and the register */
.ev-inv td,.ev-reg td{vertical-align:middle}
.ev-inv-acc{display:block;margin-top:2px;font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.ev-cell{height:34px;padding:0 10px;font-size:13.5px}
.ev-reg td,.ev-reg .th-sort{padding-left:10px;padding-right:10px}
.ev-reg td.wrap-ok{min-width:150px}
.ev-reg td.a{white-space:nowrap;text-align:right}
.ev-reg td.a .btn{height:28px;margin-left:4px}
.ev-reg tr.is-current td{background:var(--accent-soft)}
.ev-reg tr.ev-sumrow td{background:var(--ev-band);border-bottom:0}
.ev-sa-note{padding:12px 18px 16px;margin:0}
/* the head of Fixed assets: donut and figures side by side */
.ev-sa-head{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center;margin-bottom:var(--gap)}
.ev-sa-head__donut .card__title{margin-bottom:14px}
.ev-figs--grid{grid-template-columns:repeat(2,minmax(0,1fr));margin:0}
#sa-offen:not(:empty){margin-bottom:var(--gap)}
#sa-offen .ev-offer{margin:0}
.ev-plan-months{margin-top:0;border-top:var(--bw) solid var(--hairline)}
.ev-plan-months .group{border:0;border-radius:0;background:none;box-shadow:none}
.ev-months{max-height:300px;overflow:auto}
/* the asset and disposal dialogs */
.modal.ev-modal-wide{max-width:760px}
.ev-an__grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px}
.ev-an__grid--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.ev-an__grid .span2{grid-column:span 2}
.ev-an .field__label{align-items:baseline}
.ev-an .ev-links{display:inline-flex;gap:10px}
.ev-life{display:grid;gap:6px}
.ev-an-preview{display:grid;gap:12px;margin-top:16px}
.ev-figs--mini{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0}
.ev-figs--mini .ev-fig{padding:10px 12px}
.ev-figs--mini .ev-fig__v{font-size:16px}
.ev-an-years{max-height:220px;overflow:auto;border-radius:var(--r-inner);border:var(--bw) solid var(--table-border)}
.ev-an-years .table td{padding:7px 12px}
.ev-an .note{margin:12px 0 0}

/* ---------------------------------------------------------------- Setup, start, file menu (3c) */
/* the side navigation: the name on the reports (click to edit), the check line, the file menu */
.ev-owner{display:block;width:100%;margin-top:2px;padding:1px 4px;margin-left:-4px;border:var(--bw) solid transparent;border-radius:6px;background:transparent;color:var(--text-3);font-size:12px;outline:none}
.ev-owner:hover{border-color:var(--border)} .ev-owner:focus{border-color:var(--focus);color:var(--text);background:var(--field-bg)}
.ev-status{display:flex;align-items:center;gap:6px;padding:0 4px;font-size:12px;color:var(--text-2)}
.ev-status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ev-ok);flex:none}
.ev-status.is-bad{color:var(--danger)} .ev-status.is-bad::before{background:var(--danger)}
.ev-filemenu{padding:6px}
.ev-filemenu .menu__item{min-height:34px;font-size:13.5px}
.ev-menu-sep{height:var(--bw);margin:5px 6px;background:var(--hairline)}
.ev-menu-build{padding:6px 12px 4px;font-size:11px;color:var(--text-4)}
/* the start screen */
.ev-start{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.ev-start__card{width:100%;max-width:560px;display:grid;gap:20px;padding:28px}
.ev-start__brand{display:flex;gap:16px;align-items:center}
.ev-start__brand .app-icon{width:64px;height:64px;flex:none;border-radius:var(--r-icon);overflow:hidden;box-shadow:var(--shadow-icon)}
.ev-start__brand .section__title{margin:0}
.ev-start__lead{margin:4px 0 0;color:var(--text-2);font-size:14px;line-height:1.5}
.ev-start__choices{display:grid;gap:10px}
.ev-choice{display:flex;align-items:center;gap:14px;width:100%;padding:16px;text-align:left;border-radius:var(--r-card);border:var(--bw) solid var(--border);background:var(--field-bg);
  transition:border-color var(--dur-fast),background var(--dur-fast),transform var(--dur) var(--ease-spring)}
.ev-choice:hover{border-color:var(--focus);background:var(--field-bg-focus)} .ev-choice:active{transform:scale(var(--press))}
.ev-choice:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus-ring)}
.ev-choice__i{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:var(--r-icon);background:var(--accent-soft);color:var(--accent)}
.ev-choice b{display:block;font-size:15px;font-weight:600}
.ev-choice small{display:block;margin-top:2px;font-size:12.5px;color:var(--text-3);line-height:1.45}
.ev-start .note{margin:0}
.ev-start__look{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
/* the setup pages: forms to add, tables with fields in their cells */
.ev-add .card__title{margin-bottom:12px}
.ev-add__grid{display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,280px) auto;gap:12px;align-items:end}
.ev-add__grid--3{grid-template-columns:minmax(0,1fr) minmax(0,250px) auto}
.ev-setup td{vertical-align:middle;padding-top:7px;padding-bottom:7px}
.ev-setup td.nr{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.ev-setup td.a,.ev-setup th.a{width:44px;text-align:right}
.ev-setup .ev-cell{height:34px;font-size:13px;padding:0 10px}
.ev-setup .select.ev-cell{padding-right:30px}
.ev-setup .select-wrap::after{right:12px}
.ev-setup .ev-w-name{min-width:200px} .ev-setup .ev-w-grp{min-width:220px} .ev-setup .ev-w-cur{width:110px}
.ev-setup th.ev-w-ord{width:80px}
.ev-setup .input.is-bad{border-color:var(--danger)}
.ev-accounts{min-width:720px}
.ev-used{display:inline-block;min-width:22px;padding:1px 6px;border-radius:999px;background:var(--neutral-soft);font-size:11px;font-weight:600;color:var(--text-3);text-align:center}
.ev-order{display:inline-flex;gap:2px}
.ev-order .btn{width:30px;height:30px}
.ev-stack{display:grid;gap:var(--gap);margin-top:var(--gap)}
.ev-pad{padding:14px 18px 18px}
.ev-pad:empty{display:none}
.ev-sub{margin:16px 0 8px;font-size:var(--label-size);font-weight:var(--label-weight);letter-spacing:var(--label-spacing);text-transform:var(--label-case);color:var(--text-3)}
.ev-offer--info{background:var(--accent-soft);margin:0}
.chip.ev-chip-sm.is-bad{background:var(--danger-soft);color:var(--danger)}
.ev-switch-inline{padding:0;gap:10px;flex:none}
.ev-switch-inline span b{font-size:13px}
.ev-close-h{margin:12px 0 6px}
.ev-close-list{margin:0;padding-left:18px;display:grid;gap:4px}
.ev-ex{padding-top:4px}
.ev-ex + .ev-ex{margin-top:6px;border-top:var(--bw) solid var(--hairline)}
.ev-ex-status{max-width:240px}
.ev-self-start{justify-self:start}
.ev-imp{display:grid;gap:10px}
.ev-imp:empty{display:none}

/* Journal and Latest bookings from 600 px: fixed columns, so the amount always keeps its place; a long account name ends
   with … (the whole name on hover) */
@media (min-width:600px){
  .ev-jo .table.ev-buchungen{table-layout:fixed;min-width:560px}
  .ev-buchungen th:nth-child(1){width:96px}
  .ev-buchungen th:nth-child(5){width:112px}
  .ev-buchungen td.k small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
/* small phone: a booking becomes two lines (text + amount, then date · debit → credit) instead of a sideways-scrolling table */
@media (max-width:599px){
  .ev-jo thead{display:none}
  .ev-jo .table,.ev-jo .table tbody{display:block;min-width:0}
  .ev-jo .table tr{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;grid-template-areas:"t t t n" "d s h h";gap:3px 10px;padding:10px 14px;border-bottom:var(--bw) solid var(--hairline)}
  .ev-jo .table td{padding:0;border:0;white-space:normal;min-width:0}
  .ev-jo .table td.t{grid-area:t} .ev-jo .table td.num{grid-area:n}
  .ev-jo .table td.d{grid-area:d;font-size:12.5px} .ev-jo .table td.s{grid-area:s} .ev-jo .table td.hb{grid-area:h}
  .ev-jo .table td.a{display:none}
  .ev-jo .table td.k,.ev-jo .table td.k small{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev-jo .table td.hb:not(:empty)::before{content:"→ ";color:var(--text-4)}
  .ev-jo .table tr.z{padding-top:4px}
  /* the ledger: text + balance, then date · contra · movement */
  .ev-ledger .table tr{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"t t bal" "d g m"}
  .ev-ledger .table td.t{grid-area:t} .ev-ledger .table td.d{grid-area:d} .ev-ledger .table td.g{grid-area:g}
  .ev-ledger .table td.bal{grid-area:bal} .ev-ledger .table td.s,.ev-ledger .table td.hb{grid-area:m;font-size:12.5px;font-weight:500}
  .ev-ledger .table td.num{white-space:nowrap}
  .ev-ledger .table tr.ev-klick td.s:empty,.ev-ledger .table tr.ev-klick td.hb:empty{display:none}
  .ev-ledger .table tr.ev-klick td.hb:not(:empty)::before{content:"−"} .ev-ledger .table td.fx{display:none}
  .ev-tools .ev-export,.ev-st-bar .ev-export{margin-left:0;width:100%} .ev-export__what{flex:1}
  /* statements: the position and the two periods; the change columns stay on the computer */
  .ev-st:not(.ev-st--wide) .chg{display:none}
  .ev-st th.lbl,.ev-st td.lbl{min-width:0}
  .ev-st td.num{min-width:0;padding-left:8px}
  .ev-st tr.is-leaf td.lbl{padding-left:30px}
  .ev-st-bar .field{flex:1 1 140px} .ev-st-bar .select--pill{min-width:0;width:100%}
  .ev-st--wide th.lbl,.ev-st--wide td.lbl{min-width:150px;max-width:160px}
  /* 3b: donut above its list, figures in two columns, dialogs in one or two columns */
  .ev-donut{grid-template-columns:minmax(0,1fr);justify-items:center}
  .ev-sa-head{grid-template-columns:minmax(0,1fr)}
  .ev-horizon{grid-template-columns:minmax(0,1fr) auto} .ev-horizon .field__label{grid-column:1/-1}
  .ev-an__grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ev-an__grid .ev-month-f{grid-column:1/-1}
  .ev-an__grid--2 > .field{grid-column:1/-1}
