<script id="effects-glass">
(function(){
/* GLASS · signature-effects module. Optional: if it is missing or throws, the tool works the same.
   Everything it adds or listens to goes through api.add / api.on, so switching to another look removes it cleanly. */
window.THEME_FX = {
  effects: [
    { id: 'light', kind: 'signature', name: 'Drifting light', desc: 'One slow layer of blurred light moving under the glass. The only ambient element.' },
    { id: 'depth', kind: 'signature', name: 'Depth stack', desc: 'When a dialog or sheet opens, the page behind sinks back and dims; when it closes, the page floats forward again.' },
    { id: 'liquid', kind: 'signature', name: 'Liquid pill', desc: 'Tab pill and toggles stretch as they travel, then wobble into place like a drop of water.' },
    { id: 'float', kind: 'signature', name: 'Float', desc: 'Tiles lift towards you on hover, press in under your finger and spring back, and rise into place as you scroll.' },
    { id: 'frost', kind: 'signature', name: 'Frost glint', desc: 'The light on each KPI line sheds a little frost as it travels and lands with a glint. Now and then an end point twinkles.' },
    { id: 'tilt', kind: 'extra', name: 'Depth tilt', desc: 'KPI cards lean towards the pointer and the figure floats above the glass (desktop).' }
  ],
  init(api){
    const { $, $$, h, REDUCED } = api;
    const fine = window.matchMedia && matchMedia('(hover:hover) and (pointer:fine)').matches;
    const NS = 'http://www.w3.org/2000/svg';
    const sv = (tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); return e; };
    const self = this;

    /* drifting light */
    ['a', 'b', 'c'].forEach(k => api.add(h('i', { class: 'orb ' + k })));

    /* depth stack: counts open dialogs, so a dialog opened from a dialog keeps the page back */
    const main = $('#main'); let depth = $$('.overlay:not(.is-closing)').length;
    const apply = () => {
      if (depth > 0 && api.isOn('depth') && !REDUCED){
        main.style.transformOrigin = '50% ' + Math.round(window.scrollY + window.innerHeight / 2 - main.offsetTop) + 'px';
        main.classList.add('is-receded');
      } else main.classList.remove('is-receded');
    };
    api.on(document, 'dl:overlay', e => { depth = Math.max(0, depth + (e.detail && e.detail.open ? 1 : -1)); apply(); });
    this._depth = apply;

    /* liquid pill */
    (api.each || ((sel, fn) => $$(sel).forEach(fn)))('.segmented__thumb', t => { if (!t.querySelector('i')) api.add(h('i'), t); });
    const squish = el => {
      if (!el || REDUCED || !api.isOn('liquid')) return;
      el.classList.add('is-moving'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('is-moving'), 150);
    };
    api.on($('#tabs'), 'dl:tab', () => squish($('#tabs .tabs__indicator i')));   // tools without top tabs (EVEN: side navigation) skip this
    api.on(document, 'dl:seg', e => squish(e.target.querySelector('.segmented__thumb > i')));

    /* float: small tiles lift and press; every tile below the fold rises in once */
    const floatOk = c => c.classList.contains('kpi') || c.classList.contains('float-ok') || (!c.classList.contains('no-float') && c.offsetHeight <= 380 && !c.querySelector('table, form, textarea, input, select, #lineChart, #barChart, #donut, .chart, svg.chart'));
    const markOne = c => c.classList.toggle('is-float', floatOk(c));
    const markFloat = () => $$('.card').forEach(markOne);
    markFloat();
    let rt = null; api.on(window, 'resize', () => { clearTimeout(rt); rt = api.later(markFloat, 200); });
    const CONTROLS = 'button, a, input, select, textarea, label, [role="button"], [role="tab"], .segmented, .tabs, .dd, summary';
    let pressed = null;
    const release = () => { if (pressed){ pressed.classList.remove('is-pressed'); pressed = null; } };
    api.on(document, 'pointerdown', e => {
      if (REDUCED || !api.isOn('float') || e.button > 0) return;
      const c = e.target.closest && e.target.closest('.card.is-float');
      if (!c || e.target.closest(CONTROLS)) return;
      pressed = c; c.classList.add('is-pressed');
    }, { passive: true });
    ['pointerup', 'pointercancel', 'dragstart'].forEach(t => api.on(document, t, release, { passive: true }));
    api.on(window, 'scroll', release, { passive: true });

    if (!REDUCED && 'IntersectionObserver' in window){
      const io = new IntersectionObserver(es => es.forEach(en => {
        if (!en.isIntersecting) return;
        const c = en.target; io.unobserve(c);
        c.classList.add('is-rising'); requestAnimationFrame(() => c.classList.remove('is-rise'));
        api.later(() => c.classList.remove('is-rising'), 1000);
      }), { rootMargin: '0px 0px -6% 0px', threshold: .08 });
      const riseOne = c => { if (c.getBoundingClientRect().top > window.innerHeight){ c.classList.add('is-rise'); io.observe(c); } };
      $$('.card').forEach(riseOne);
      this._io = io;
      /* pages a tool draws later: mark them too (once per card) */
      if (api.each) api.each('.card', c => { requestAnimationFrame(() => { if (!c.isConnected) return; markOne(c); riseOne(c); }); });
    }

    /* frost glint: listens to the sparkline's start / end / rest signals */
    const dots = new WeakMap(), heads = new WeakMap();
    const dotOf = svg => {
      let g = dots.get(svg);
      if (!g || !g.isConnected){
        g = sv('g', { class: 'gdot' });
        g.appendChild(sv('circle', { class: 'gdot__halo', r: '5.5' }));
        g.appendChild(sv('circle', { class: 'gdot__core', r: '2' }));
        g.appendChild(sv('polygon', { class: 'gdot__star', points: '0,-8 .9,-.9 8,0 .9,.9 0,8 -.9,.9 -8,0 -.9,-.9' }));
        api.add(g, svg); dots.set(svg, g);
      }
      return g;
    };
    const headOf = svg => {
      let g = heads.get(svg);
      if (!g || !g.isConnected){
        g = sv('g', { class: 'ghead' });
        g.appendChild(sv('polygon', { points: '0,-6.5 .7,-.7 6.5,0 .7,.7 0,6.5 -.7,.7 -6.5,0 -.7,-.7' }));
        api.add(g, svg); heads.set(svg, g);
      }
      return g;
    };
    const endPoint = svg => {
      const line = svg.querySelector('.spark__line'); const L = line && line.getTotalLength ? line.getTotalLength() : 0;
      return L ? line.getPointAtLength(L) : null;
    };
    const place = (svg, twinkle) => {
      const p = endPoint(svg); if (!p) return;
      const g = dotOf(svg); g.setAttribute('transform', 'translate(' + p.x.toFixed(2) + ' ' + p.y.toFixed(2) + ')'); g.classList.add('is-on');
      if (twinkle) twinkleDot(g);
    };
    const twinkleDot = g => {
      if (REDUCED || !api.isOn('frost')) return;
      g.classList.remove('is-twinkle'); requestAnimationFrame(() => { g.classList.add('is-twinkle'); api.later(() => g.classList.remove('is-twinkle'), 1150); });
    };
    const follow = svg => {
      const head = svg.querySelector('.spark__head'), gh = headOf(svg);
      let lx = null, ly = null;
      const tick = () => {
        if (!api.alive() || !svg.classList.contains('is-running')){ gh.classList.remove('is-on'); return; }
        const m = /translate\(([-\d.]+)[ ,]+([-\d.]+)\)/.exec(head.getAttribute('transform') || '');
        if (m){
          const x = +m[1], y = +m[2];
          if (x > -10){
            gh.setAttribute('transform', 'translate(' + x + ' ' + y + ')'); gh.classList.add('is-on');
            if (lx === null || Math.hypot(x - lx, y - ly) > 7){
              if (lx !== null && api.isOn('frost')){
                const c = sv('circle', { class: 'gl', cx: (x + (Math.random() - .5) * 5).toFixed(1), cy: (y + (Math.random() - .5) * 6).toFixed(1), r: (.7 + Math.random() * 1).toFixed(2) });
                svg.appendChild(c); setTimeout(() => c.remove(), 950);
              }
              lx = x; ly = y;
            }
          }
        }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    };
    api.on(document, 'dl:spark', e => {
      const svg = e.target, ph = e.detail && e.detail.phase;
      if (ph === 'start'){ const g = dots.get(svg); if (g) g.classList.remove('is-on'); if (!REDUCED) follow(svg); }
      else if (ph === 'end') place(svg, true);
      else if (ph === 'rest') place(svg, false);
    });
    $$('.spark.is-done').forEach(s => place(s, false));
    /* now and then, one end point twinkles; never while the tab is hidden */
    const idle = () => {
      api.later(() => {
        if (document.visibilityState === 'visible'){
          const all = $$('.spark.is-done').filter(s => { const r = s.getBoundingClientRect(); return r.bottom > 0 && r.top < window.innerHeight; });
          if (all.length){ const g = dots.get(all[Math.floor(Math.random() * all.length)]); if (g) twinkleDot(g); }
        }
        idle();
      }, 5500 + Math.random() * 5000);
    };
    if (!REDUCED) idle();

    /* depth tilt: lean plus lift, and the figure floats a little further than the card */
    if (fine && !REDUCED){
      /* delegated, so KPI cards the tool draws later tilt too */
      let cur = null;
      const off = () => { if (cur){ cur.classList.remove('is-tilting'); cur.style.transform = ''; cur = null; } };
      api.on(document, 'pointermove', e => {
        const k = e.target.closest && e.target.closest('.kpi');
        if (k !== cur) off();
        if (!k || !api.isOn('tilt') || k.classList.contains('is-pressed')) return;
        cur = k;
        const r = k.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
        const lift = api.isOn('float') ? ' translate3d(0,-5px,0)' : '';
        k.classList.add('is-tilting');
        k.style.setProperty('--gx', (x * 2).toFixed(3)); k.style.setProperty('--gy', (y * 2).toFixed(3));
        k.style.transform = 'perspective(700px)' + lift + ' rotateX(' + (-y * 11).toFixed(2) + 'deg) rotateY(' + (x * 12).toFixed(2) + 'deg)';
      }, { passive: true });
      api.on(document, 'pointerleave', off);
    }
    self._cleanup = () => {
      $$('.card').forEach(c => { c.classList.remove('is-float', 'is-pressed', 'is-rise', 'is-rising', 'is-tilting'); });
      $$('.kpi').forEach(k => { k.style.transform = ''; k.style.removeProperty('--gx'); k.style.removeProperty('--gy'); });
      $$('.spark .gl').forEach(n => n.remove());
    };
  },
  toggle(id, on){
    if (id === 'depth' && this._depth) this._depth();
    if (id === 'tilt' && !on) document.querySelectorAll('.kpi').forEach(k => { k.style.transform = ''; k.classList.remove('is-tilting'); });
    if (id === 'float' && !on) document.querySelectorAll('.card.is-rise').forEach(c => c.classList.remove('is-rise'));
  },
  destroy(){
    if (this._io) this._io.disconnect(); this._io = null;
    if (this._cleanup) this._cleanup(); this._cleanup = null;
    const m = document.getElementById('main'); if (m){ m.classList.remove('is-receded'); m.style.transformOrigin = ''; }
    this._depth = null;
  }
};
if (window.DL_THEMES && window.DL_THEMES["glass"]) window.DL_THEMES["glass"].fx = window.THEME_FX;
delete window.THEME_FX;
})();
</script>

<script id="effects-ember">
(function(){

    { id: 'strike', kind: 'signature', name: 'Strike', desc: 'Buttons punch back when pressed: a flash of heat from the tap point, a molten sheen on hover.' },
    { id: 'heat', kind: 'signature', name: 'Heat-up', desc: 'KPI cards carry a live ember edge, and each number flares as it lands.' },

  ],
  init(api){
    const { $$, h, REDUCED } = api;

    /* ember bed + sparks */
    api.add(h('i', { class: 'embers' }));
    const n = window.innerWidth < 700 ? 7 : 12;
    for (let k = 0; k < n; k++){
      const s = h('i', { class: 'spark' });
      s.style.left = (6 + Math.random() * 88) + '%';
      s.style.setProperty('--t', (11 + Math.random() * 9).toFixed(1) + 's');
      s.style.setProperty('--d', (-Math.random() * 18).toFixed(1) + 's');
      s.style.setProperty('--x', ((Math.random() - .5) * 140).toFixed(0) + 'px');
      if (Math.random() < .35){ s.style.width = s.style.height = '2px'; }
      api.add(s);

    /* strike */

      if (REDUCED || !api.isOn('strike')) return;

<script id="effects-prism">
(function(){
/* PRISM · signature-effects module. Optional: if it is missing or throws, the tool works the same.
   One light source for the whole page (pointer, phone tilt, or a slow drift when nobody touches anything):
   it moves the caustic light on the wall and places a glint on the edge of every panel that faces it.
   Everything it adds or listens to goes through api.add / api.on / api.loop, so switching looks removes it cleanly. */
window.THEME_FX = (function(){
  let API = null, tiltOn = false, lastInput = -1e9;
  const L = { x: -.4, y: -.6, tx: -.4, ty: -.6 };
  return {
    effects: [
      { id: 'caustic', kind: 'signature', name: 'Caustic light', desc: 'Soft rainbow light on the wall, as if the sun came through a crystal. Drifts slowly and leans towards your pointer. The only ambient element.' },
      { id: 'rim', kind: 'signature', name: 'Spectral edge', desc: 'Every panel has a hairline of split light, and a glint sits on the edge that faces the light. Primary buttons get a flash of light on hover.' },
      { id: 'focus', kind: 'signature', name: 'Refraction focus', desc: 'Key figures arrive split into colour, then snap into focus.' },
      { id: 'sweep', kind: 'extra', name: 'Save beam', desc: 'A thin beam of spectrum crosses the screen when a save succeeds.' },
      { id: 'phonetilt', kind: 'extra', off: true, name: 'Phone tilt', desc: 'Tilting the phone moves the light. On the iPhone, iOS forgets the motion access whenever the app closes, so the app never asks by itself: switch it on when you want it (one prompt for that visit).' }
    ],

    numberRevealEffect: 'focus',
    numberReveal(el, from, to, fmt, done){
      const txt = fmt(to), key = {}, mk = c => { const s = document.createElement('span'); s.className = c; s.textContent = txt; return s; };
      el._refr = key;
      const w = document.createElement('span'); w.className = 'refr';
      w.appendChild(mk('refr__main'));
      ['a', 'b', 'c'].forEach(k => { const g = mk('refr__g refr__g--' + k); g.setAttribute('aria-hidden', 'true'); w.appendChild(g); });
      el.textContent = ''; el.appendChild(w);
      setTimeout(() => { if (el._refr !== key) return; el.textContent = txt; done(); }, 1050);
    },

    init(api){
      API = api; tiltOn = false; lastInput = -1e9;

  }
  const closeNow = () => close(false);
  function onScroll(e){ if (open && !open.menu.contains(e.target)) close(false); }
  function outside(e){ if (open && !open.menu.contains(e.target) && e.target !== open.sel) close(false); }
  function show(sel){
    if (open){ const same = open.sel === sel; close(false); if (same) return; }
    const r = sel.getBoundingClientRect();
    const menu = h('div', { class: 'menu', role: 'listbox', 'aria-label': sel.getAttribute('aria-label') || sel.name || 'Options' });
    const pick = i => {
      if (sel.selectedIndex !== i){ sel.selectedIndex = i; sel.dispatchEvent(new Event('input', { bubbles: true })); sel.dispatchEvent(new Event('change', { bubbles: true })); }
      close(true);
    };
    Array.prototype.forEach.call(sel.options, (o, i) => {
      menu.appendChild(h('button', { type: 'button', role: 'option', class: 'menu__item' + (o.selected ? ' is-selected' : ''), 'aria-selected': o.selected ? 'true' : 'false',
        disabled: o.disabled ? 'disabled' : null, onclick: () => pick(i) }, [h('span', {}, [o.textContent]), h('i', { html: check })]));
    });
    document.body.appendChild(menu);
    const below = window.innerHeight - r.bottom - 12, need = Math.min(menu.scrollHeight, 320), up = below < Math.min(need, 220) && r.top > below;
    menu.style.minWidth = r.width + 'px';
    menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - menu.offsetWidth - 8)) + 'px';
    if (up){ menu.classList.add('is-up'); menu.style.bottom = (window.innerHeight - r.top + 6) + 'px'; menu.style.maxHeight = Math.min(320, r.top - 12) + 'px'; }
    else { menu.style.top = (r.bottom + 6) + 'px'; menu.style.maxHeight = Math.min(320, below) + 'px'; }
    const cur = menu.children[sel.selectedIndex];
    if (cur){ cur.scrollIntoView({ block: 'nearest' }); try { cur.focus({ preventScroll: true }); } catch (e){} }
    menu.addEventListener('keydown', e => {
      const items = $$('.menu__item:not([disabled])', menu), k = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); const n = items[Math.max(0, Math.min(items.length - 1, k + (e.key === 'ArrowDown' ? 1 : -1)))]; if (n) n.focus(); }
      else if (e.key === 'Home' || e.key === 'End'){ e.preventDefault(); const n = items[e.key === 'Home' ? 0 : items.length - 1]; if (n) n.focus(); }
      else if (e.key === 'Escape' || e.key === 'Tab'){ e.preventDefault(); e.stopPropagation(); close(true); }
      else if (e.key.length === 1 && /\S/.test(e.key)){
        const c = e.key.toLowerCase(), starts = b => b.textContent.trim().toLowerCase().indexOf(c) === 0;
        const n = items.find((b, j) => j > k && starts(b)) || items.find(starts); if (n) n.focus();
      }
    });
    sel.classList.add('is-open');
    open = { sel, menu };
    setTimeout(() => { document.addEventListener('pointerdown', outside, true); window.addEventListener('resize', closeNow); window.addEventListener('scroll', onScroll, true); }, 0);
  }
  document.addEventListener('mousedown', e => {
    const s = e.target.closest && e.target.closest(SEL);
    if (!s || e.button !== 0 || s.disabled) return;
    e.preventDefault(); try { s.focus({ preventScroll: true }); } catch (er){} show(s);
  });
  document.addEventListener('keydown', e => {
    const s = e.target;
    if (!(s instanceof HTMLSelectElement) || !s.matches(SEL)) return;
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'F4' || (e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp'))){ e.preventDefault(); show(s); }
  });
}

/* ================================================================ Save to folder: the app folder and its backup folder
   Picked once per site (desktop Chrome/Edge), e.g. the folder APPS/RISE: its "02 BACKUP" subfolder becomes the backup folder
   by itself, or the tool lets you pick one. save() writes today's file into the app folder and moves the data files it
   replaces into the backup folder (copy, read back, then remove): nothing is ever deleted. A browser only knows a
   folder's name, never its path. write(name, blob) is the old one-folder save (starter, new tools): unchanged. */
const folder = (function(){
  const can = typeof window.showDirectoryPicker === 'function' && !TOUCH;
  let handle = null, sicher = null, geladen = false;
  function idb(){ return new Promise((ok, no) => { const r = indexedDB.open('dl-' + cfg.app, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); }
  async function lesen(k){ try { const db = await idb(); return await new Promise(ok => { const t = db.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => ok(t.result || null); t.onerror = () => ok(null); }); } catch (e){ return null; } }
  async function merken(k, v){ try { const db = await idb(), s = db.transaction('kv', 'readwrite').objectStore('kv'); if (v) s.put(v, k); else s.delete(k); } catch (e){} }
  async function laden(){ if (geladen) return; geladen = true; if (!handle) handle = await lesen('folder'); if (!sicher) sicher = await lesen('backup'); }
  async function get(){ if (!can) return null; await laden(); return handle; }
  async function backup(){ if (!can) return null; await laden(); return sicher; }
  /* the app folder; its "02 BACKUP" (folder standard) becomes the backup folder by itself. Returns the folder handle */
  async function choose(){
    await laden();
    const opt = { id: 'dl-' + cfg.app, mode: 'readwrite' }; if (handle) opt.startIn = handle;
    const neu = await window.showDirectoryPicker(opt);
    handle = neu; await merken('folder', neu);
    try { const b = await neu.getDirectoryHandle('02 BACKUP'); sicher = b; await merken('backup', b); } catch (e){}
    return handle;
  }
  async function chooseBackup(){
    await laden();
    const opt = { id: 'dl-' + cfg.app + '-backup', mode: 'readwrite' }; if (sicher || handle) opt.startIn = sicher || handle;
    const neu = await window.showDirectoryPicker(opt);
    if (handle && neu.isSameEntry && await neu.isSameEntry(handle)) throw new Error('The backup folder has to be another folder than the app folder.');
    sicher = neu; await merken('backup', neu);
    return sicher;
  }
  async function forget(){ await laden(); handle = null; sicher = null; await merken('folder', null); await merken('backup', null); }
  async function zugriff(h){
    try { if (!h.queryPermission || await h.queryPermission({ mode: 'readwrite' }) === 'granted') return true; return (await h.requestPermission({ mode: 'readwrite' })) === 'granted'; }
    catch (e){ return false; }
  }
  /* a folder that was moved, renamed or deleted since it was picked cannot be read any more */
  async function erreichbar(h){ try { const it = h.values(); await it.next(); return true; } catch (e){ return !(e && e.name === 'NotFoundError'); } }
  const lies = async h => (await h.getFile()).text();
  async function schreib(dir, name, text){ const fh = await dir.getFileHandle(name, { create: true }), w = await fh.createWritable(); await w.write(text); await w.close(); return fh; }
  /* moves one file from the app folder into the backup folder: copy, read back, then remove. Same name there with other
     content: " 2", " 3" … is added; same content: the copy is already there */
  async function verschieben(name, h){
    const text = await lies(h); let ziel = name, i = 2;
    for (;;){
      let da = null; try { da = await sicher.getFileHandle(ziel); } catch (e){}
      if (!da) break;
      if (await lies(da) === text){ await handle.removeEntry(name); return ziel; }
      ziel = name.replace(/(\.[^.]+)?$/, ' ' + (i++) + '$1');
    }
    const fh = await schreib(sicher, ziel, text);
    if (await lies(fh) !== text) throw new Error('The backup copy of ' + name + ' did not read back the same. Nothing was moved.');
    await handle.removeEntry(name);
    return ziel;
  }
  /* o: { name: today's file, text, copyName, basis: the "saved" stamp this window started from,
          isData(name): the data files a save replaces, stamp(text): a file's "saved" stamp, check(text): true when a
          written file reads back right,
          ask({ kind: 'newer' | 'today', files: [{ name, stamp }], folder }) → 'ersetzen' | 'neu' | null }
     'newer': a data file in the app folder was saved after the version this window started from (the iPhone, another
     window); 'today': today's file is there and is not the one this window has. 'ersetzen': it goes to the backup folder
     and this version takes its place; 'neu': this version is saved under copyName and nothing is moved.
     Returns null (no folder chosen) or { name, handle, folder, backup, moved: [[from, to]], noBackup }
     or { cancel } / { missing: 'folder' | 'backup', folder } / { denied: 'folder' | 'backup', folder }. */
  async function save(o){
    const root = await get(); if (!root) return null;
    if (!(await zugriff(root))) return { denied: 'folder', folder: root.name };
    if (!(await erreichbar(root))) return { missing: 'folder', folder: root.name };
    const bk = await backup();
    if (bk){
      if (!(await zugriff(bk))) return { denied: 'backup', folder: bk.name };
      if (!(await erreichbar(bk))) return { missing: 'backup', folder: bk.name };
    }
    const daten = [];
    for await (const h of root.values()){
      if (h.kind !== 'file' || !o.isData(h.name)) continue;
      let s = null; try { s = o.stamp(await lies(h)); } catch (e){}
      daten.push({ name: h.name, stamp: s, handle: h });
    }
    const basis = o.basis || null;
    const spaetere = daten.filter(d => d.stamp && d.stamp !== basis && (!basis || d.stamp > basis));
    const heute = daten.find(d => d.name === o.name);
    let ziel = o.name, wahl = 'ersetzen';
    if (spaetere.length) wahl = await o.ask({ kind: 'newer', files: spaetere.map(d => ({ name: d.name, stamp: d.stamp })), folder: root.name });
    else if (heute && heute.stamp !== basis) wahl = await o.ask({ kind: 'today', files: [{ name: heute.name, stamp: heute.stamp }], folder: root.name });
    if (!wahl) return { cancel: true };
    if (wahl === 'neu') ziel = o.copyName;
    const moved = [];
    /* today's file that is not this window's version goes to the backup first: never overwritten without a copy */
    if (ziel === o.name && heute && heute.stamp !== basis){
      if (!bk) throw new Error('Choose a backup folder first: ' + o.name + ' is in the app folder and would be replaced.');
      moved.push([heute.name, await verschieben(heute.name, heute.handle)]);
    }
    const fh = await schreib(root, ziel, o.text);
    if (!o.check(await lies(fh))) throw new Error(ziel + ' did not read back the same. The other files were left where they are.');
    if (ziel === o.name && bk){
      for (const d of daten) if (d.name !== ziel && !moved.some(m => m[0] === d.name)) moved.push([d.name, await verschieben(d.name, d.handle)]);
    }
    return { name: ziel, handle: fh, folder: root.name, backup: bk ? bk.name : null, moved, noBackup: !bk && daten.some(d => d.name !== ziel) };
  }
  /* writes name into the chosen folder; null when there is no folder or no access (the caller then falls back) */
  async function write(name, blob){
    const f = await get(); if (!f) return null;
    try {
      if (f.queryPermission && await f.queryPermission({ mode: 'readwrite' }) !== 'granted' && (await f.requestPermission({ mode: 'readwrite' })) !== 'granted') return null;
      const fh = await f.getFileHandle(name, { create: true }), w = await fh.createWritable(); await w.write(blob); await w.close();
      return { name, folder: f.name };
    } catch (e){ return null; }
  }
  return { can, get, backup, choose, chooseBackup, forget, save, write };
})();

return { themeSwitch: segmentedThemes, lookButton, init, set, theme: () => current, themes: () => Object.keys(THEMES), meta: id => (THEMES[id || current] || {}).meta, isOn, setEffect, numberReveal,
  appearanceUI, initDropdowns, folder, tok, rgb, REDUCED, TOUCH };
})();
</script>
